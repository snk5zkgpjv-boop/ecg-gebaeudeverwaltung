body{background:linear-gradient(180deg,#fff 0,#f8f8f8 180px,#f7f7f7 100%)} 
.topbar{background:rgba(255,255,255,.97);padding:14px 18px}

.hero h2{font-size:28px;letter-spacing:-.7px}
.hero p{color:rgba(32,33,36,.72);max-width:730px}
.btn.primary{background:#202124;border-color:#202124}
.btn.soft{background:var(--accent2);color:#8f0038}
.check.done{background:#202124;border-color:#202124}
.tab.active{background:var(--accent2);color:#8f0038}
.stat b{font-weight:800}
.section-title h2{letter-spacing:-.25px}
.area-card{position:relative;overflow:hidden}.area-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.asset-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#f2f4f7;border-radius:7px;padding:3px 6px}
.segmented{display:flex;gap:6px;background:#efefef;padding:4px;border-radius:13px;width:max-content;max-width:100%;overflow:auto}

.segmented button.active{background:white;color:#202124;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.inventory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.room-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.room-actions .btn{flex:1;min-width:88px}
.qr-sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.qr-label{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;break-inside:avoid;background:#fff}
.qr-label img{width:170px;height:170px;object-fit:contain}
.qr-label b{display:block;margin-top:8px;font-size:14px}.qr-label small{display:block;color:var(--muted);margin-top:3px}

@media print{
  body.qr-print-mode #app{display:none!important}
  body.qr-print-mode #modalRoot{display:block!important}
  body.qr-print-mode .modal-backdrop{position:static!important;background:white!important;display:block!important}
  body.qr-print-mode .modal{width:100%!important;max-width:none!important;max-height:none!important;overflow:visible!important;border-radius:0!important;box-shadow:none!important}
  body.qr-print-mode .print-hide{display:none!important}
  body.qr-print-mode .qr-sheet{grid-template-columns:repeat(3,1fr)!important;gap:8mm!important}

  body.qr-print-mode .qr-label img{width:42mm!important;height:42mm!important}
}


.calendar-card{display:grid;gap:8px}

.event-row:first-child{border-top:0}
.event-date{font-weight:800;color:var(--accent);text-align:center}
.event-date span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.event-title{font-weight:750}.event-meta{font-size:12px;color:var(--muted);margin-top:3px}
.event-rule{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.event-task-source{font-size:11px;color:var(--accent);font-weight:700;margin-top:3px}
.calendar-sync{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--accent2);color:#5f1b36}

.task-admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.stat.clickable{cursor:pointer;transition:.15s}.stat.clickable:active{transform:scale(.98)}
.issue{cursor:pointer}.issue .btn,.issue select{cursor:pointer}
.edit-task-row{padding:11px 0;border-top:1px solid var(--line)}.edit-task-row:first-child{border-top:0}

.topbar{border-bottom:1px solid #d9d9d9}
.brand h1{color:#4a4a4a;font-weight:600}
.brand small{color:#777}
.tab.active{background:transparent;color:var(--accent);position:relative}

.btn.primary{background:var(--accent);border-color:var(--accent)}
.hero h2{color:var(--accent);font-weight:650}
.stat b,.section-title h2{color:#2d2d2d}

function due(task){if(['asneeded','afteruse','afterevent'].includes(task.interval))return false;if(!task.lastDone)return true;const d=new Date(task.lastDone), n=new Date();const days=(n-d)/86400000;return {daily:days>=1,weekly:days>=7,biweekly:days>=14,monthly:days>=30,quarterly:days>=90,semiannual:days>=182,annual:days>=365}[task.interval]||false}
function allTasks(){return state.rooms.flatMap(r=>r.tasks.map(x=>({...x,room:r})))}
function floorSortKey(floor){const s=(floor||'').toLowerCase().replace(/\s/g,'');if(s.includes('basis')||s==='ug'||s.includes('untergeschoss'))return 0;if(s==='eg'||s.includes('erdgeschoss'))return 10;const m=s.match(/(\d+)[.]?og/);if(m)return 10+Number(m[1]);if(s.includes('dg')||s.includes('dachgeschoss'))return 90;return 50}
function groupDueTasksByFloor(tasks){const groups={};tasks.forEach(x=>{const f=x.room.floor||'Ohne Geschoss';(groups[f]??=[]).push(x)});return Object.entries(groups).sort((a,b)=>floorSortKey(a[0])-floorSortKey(b[0])||a[0].localeCompare(b[0],'de')).map(([floor,items])=>[floor,items.sort((a,b)=>a.room.name.localeCompare(b.room.name,'de')||a.title.localeCompare(b.title,'de'))])}
function timeEntryLabel(e){if(e.workLabel)return e.workLabel;const r=state.rooms.find(x=>x.id===e.roomId);return r?`${r.floor} – ${r.name}`:'Allgemein / kein Raum'}

function eventRuleFor(ev){return (state.eventRules||[]).find(r=>(ev.title||'').toLowerCase().includes((r.keyword||'').toLowerCase()))}
function eventRoomsFor(rule){
 if(!rule)return[];
 const matches=[];
 for(const r of state.rooms){
   if((rule.roomMatch||[]).some(m=>(r.name+' '+r.type).toLowerCase().includes(String(m).toLowerCase())))matches.push(r)
 }
 return matches
}
function generatedEventTasks(){
 const now=Date.now(),lookback=7*86400000,out=[];
 for(const ev of (state.calendarEvents||[])){
   if(ev.cancelled||/fällt aus|abgesagt|entfällt/i.test(ev.title||''))continue;
   const end=new Date(ev.end).getTime();
   if(end>now||now-end>lookback)continue;
   const rule=eventRuleFor(ev); if(!rule)continue;
   const rooms=eventRoomsFor(rule);
   for(const r of rooms){
     for(const title of (rule.tasks||[])){
       const id=`${ev.id}__${r.id}__${title}`;
       if(state.eventTaskDone?.[id])continue;
       out.push({id,title,room:r,event:ev,rule:rule,interval:'afterevent',status:'open'})
     }
   }
 }
 return out
}
function upcomingEvents(limit=6){

}

function render(){
 let body=state.activeTab==='dashboard'?dashboard():
          state.activeTab==='building'?buildingView():
          state.activeTab==='inventory'?inventoryView():
          state.activeTab==='issues'?issuesView():
          state.activeTab==='calendar'?calendarView():
          settingsView();
 $('#app').innerHTML=`<div class="shell">${header()}<main class="main">${body}</main>${nav()}</div>`
}
window.go=id=>{state.activeTab=id;save();render()};

function timeElapsed(){
  if(!state.timeRunning)return 0;
  return Math.max(0,Date.now()-new Date(state.timeRunning.start).getTime())
}
function fmtDuration(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60),mm=m%60;return `${h}:${String(mm).padStart(2,'0')} Std.`}
function dashboard(){
  const s=stats(),eventTasks=generatedEventTasks(),dueTasks=[...allTasks().filter(x=>due(x)),...eventTasks],dueGroups=groupDueTasksByFloor(dueTasks),u=currentUser(),upcoming=upcomingEvents(5);
  const timer=state.timeRunning;
  const recent=(state.timeEntries||[]).slice(0,5);
  return `<section class="hero"><h2>Gebäudeverwaltung</h2><p>Gebäude, Außenanlagen, Inventar, Material, Arbeitszeit und Mängel an einem Ort. Ohne Leistungsranglisten oder Mitarbeiterbewertung.</p></section>
  <div class="grid stats" style="margin-top:14px"><div class="stat"><b>${s.due}</b><span>Aufgaben fällig</span></div><div class="stat"><b>${s.rooms}</b><span>Räume angelegt</span></div><div class="stat clickable" onclick="showOpenIssues()"><b>${s.issues}</b><span>offene Hinweise</span><small>antippen zum Öffnen</small></div><div class="stat"><b>${s.low}</b><span>Material unter Mindestbestand</span></div></div>
  <div class="section-title"><h2>Zeiterfassung</h2></div>
  <div class="card timer-card">
    ${u?`<div class="row wrap"><div><div class="task-title">${esc(u.name)}</div><div class="meta">${esc(u.email||'lokales Profil')} · ${esc(roleLabels[u.role])}</div></div><div class="spacer"></div>${timer?`<div class="timer-time" id="liveTimer">${fmtDuration(timeElapsed())}</div>`:''}</div>
    ${timer?`<div class="notice"><b>${esc(timeEntryLabel(timer))}</b><br>Gestartet ${new Date(timer.start).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}${timer.note?` · ${esc(timer.note)}`:''}</div><button class="btn danger" onclick="stopTime()">Arbeitszeit beenden</button>`:
    `<div class="formgrid"><div class="field wide"><label>Bereich / Raum</label><select id="timeRoom"><option value="">Allgemein / kein Raum</option>${state.rooms.slice().sort((a,b)=>floorSortKey(a.floor)-floorSortKey(b.floor)||a.name.localeCompare(b.name,'de')).map(r=>`<option value="${r.id}">${esc(r.floor)} – ${esc(r.name)}</option>`).join('')}</select></div><div class="field wide"><label>Tätigkeit / Bemerkung (optional)</label><input id="timeNote" placeholder="z. B. Grundreinigung, Auffüllen, Reparatur…"></div></div><button class="btn primary" onclick="startTime()">Arbeitszeit starten</button>`}`:
    `<div class="notice">Für die Zeiterfassung zuerst einen Benutzer auswählen.</div>`}
    ${recent.length?`<div><div class="meta" style="margin-bottom:6px">Letzte Einträge</div>${recent.map(e=>{const eu=state.users.find(x=>x.id===e.userId);return `<div class="task"><div></div><div><div class="task-title">${esc(timeEntryLabel(e))}</div><small>${esc(eu?.name||'Benutzer')} · ${new Date(e.start).toLocaleString('de-DE')} · ${fmtDuration(new Date(e.end)-new Date(e.start))}${e.note?` · ${esc(e.note)}`:''}</small></div></div>`}).join('')}</div>`:''}
  </div>
  <div class="section-title"><h2>Heute fällig</h2></div>${dueGroups.length?dueGroups.map(([floor,items])=>`<div class="card" style="margin-bottom:12px"><div class="row" style="padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px"><h3 style="margin:0">${esc(floor)}</h3><div class="spacer"></div><span class="pill warn">${items.length} fällig</span></div>${items.map(x=>taskRow(x.room,x)).join('')}</div>`).join(''):'<div class="card"><div class="empty">Aktuell nichts fällig.</div></div>'}
  <div class="section-title"><h2>Kommende Veranstaltungen</h2><div class="spacer"></div><button class="btn tiny" onclick="go('calendar')">Kalender öffnen</button></div>
  <div class="card calendar-card">${upcoming.length?upcoming.map(ev=>{const d=eventDateLabel(ev),rule=eventRuleFor(ev);return `<div class="event-row"><div class="event-date">${d.day}<span>${d.mon}</span></div><div><div class="event-title">${esc(ev.title)}</div><div class="event-meta">${d.time}${ev.location?` · ${esc(ev.location)}`:''}</div></div><span class="pill ${ev.cancelled?'warn':rule?'ok':''}">${ev.cancelled?'fällt aus':rule?'Aufgabenregel':'Kalender'}</span></div>`}).join(''):'<div class="empty">Keine kommenden Veranstaltungen.</div>'}</div>
  <div class="section-title"><h2>Schnellzugriff</h2></div><div class="grid room-list"><div class="card room" onclick="go('calendar')"><h3>Kalender & Veranstaltungen</h3><div class="meta">Google-Kalender und Folgeaufgaben</div></div>${state.rooms.slice(0,3).map(roomCard).join('')}</div>`
}
window.startTime=()=>{const u=currentUser();if(!u){alert('Bitte zuerst Benutzer auswählen.');return}const roomId=$('#timeRoom')?.value||'',r=state.rooms.find(x=>x.id===roomId),note=$('#timeNote')?.value.trim()||'';state.timeRunning={id:uid('time'),userId:u.id,start:nowISO(),roomId,workLabel:r?`${r.floor} – ${r.name}`:'Allgemein / kein Raum',note};save();render();startTimerTick()};
window.stopTime=()=>{if(!state.timeRunning)return;const e={...state.timeRunning,end:nowISO()};state.timeEntries.unshift(e);state.timeRunning=null;save();render()};
let timerInterval=null;function startTimerTick(){clearInterval(timerInterval);timerInterval=setInterval(()=>{const el=$('#liveTimer');if(el&&state.timeRunning)el.textContent=fmtDuration(timeElapsed())},15000)}

function taskRow(r,t){
 if(t.event)return `<div class="task"><button class="check" onclick="completeEventTask('${t.id}')"></button><div><div class="task-title">${esc(t.title)}</div><small>${esc(r.name)} · ${esc(r.floor)}</small><div class="event-task-source">Nach Veranstaltung: ${esc(t.event.title)} · ${new Date(t.event.end).toLocaleDateString('de-DE')}</div></div><button class="btn tiny" onclick="completeEventTask('${t.id}')">erledigt</button></div>`;
 const admin=state.currentRole==='admin';
 return `<div class="task"><button class="check ${t.status==='done'?'done':''}" onclick="toggleTask('${r.id}','${t.id}')">${t.status==='done'?'✓':''}</button><div><div class="task-title">${esc(t.title)}</div><small>${esc(r.name)} · ${esc(r.floor)} · ${intervals[t.interval]||t.interval}${t.lastDone?` · zuletzt ${new Date(t.lastDone).toLocaleDateString('de-DE')}`:''}</small>${admin&&state.currentRoomId===r.id?`<div class="task-admin-actions"><button class="btn tiny" onclick="editTask('${r.id}','${t.id}')">Bearbeiten</button><button class="btn tiny danger" onclick="deleteTask('${r.id}','${t.id}')">Löschen</button></div>`:''}</div><select class="btn tiny" onchange="setTaskStatus('${r.id}','${t.id}',this.value)"><option value="open" ${t.status==='open'?'selected':''}>offen</option><option value="done" ${t.status==='done'?'selected':''}>erledigt</option><option value="na" ${t.status==='na'?'selected':''}>nicht nötig</option><option value="material" ${t.status==='material'?'selected':''}>Material fehlt</option><option value="note" ${t.status==='note'?'selected':''}>Hinweis</option></select></div>`
}
window.completeEventTask=id=>{state.eventTaskDone[id]={doneAt:nowISO(),userId:state.currentUserId||null};save();render()};
window.toggleTask=(rid,tid)=>{const t=state.rooms.find(r=>r.id===rid).tasks.find(t=>t.id===tid);t.status=t.status==='done'?'open':'done';if(t.status==='done'){t.lastDone=nowISO();t.lastDoneBy=state.currentUserId||null}save();render()};
window.setTaskStatus=(rid,tid,v)=>{const t=state.rooms.find(r=>r.id===rid).tasks.find(t=>t.id===tid);t.status=v;if(v==='done')t.lastDone=nowISO();save();render()};

function roomCard(r){
 const dueN=r.tasks.filter(due).length,admin=state.currentRole==='admin';
 return `<div class="card room" onclick="openRoom('${r.id}')">
   <div class="row"><div><h3>${esc(r.name)}</h3><div class="meta">${esc(r.floor)} · ${esc(r.type)}</div></div><div class="spacer"></div><span class="pill ${dueN?'warn':'ok'}">${dueN?dueN+' fällig':'aktuell'}</span></div>
   <div class="meta" style="margin-top:8px">${r.tasks.length} Aufgaben · QR-ID ${esc(r.qrId.slice(-6).toUpperCase())}</div>
   <div class="room-actions" onclick="event.stopPropagation()">
     <button class="btn tiny soft" onclick="showQR('${r.id}')">QR-Code</button>
     ${admin?`<button class="btn tiny" onclick="editRoom('${r.id}')">Bearbeiten</button>`:''}
     <button class="btn tiny" onclick="openRoom('${r.id}')">Aufgaben</button>
   </div>
 </div>`
}

function buildingView(){
 const tab=state.buildingSubTab||'rooms';
 return `<div class="section-title"><h2>Gebäude & Außenanlagen</h2></div>
 <div class="segmented">
   <button class="${tab==='rooms'?'active':''}" onclick="setBuildingTab('rooms')">Räume</button>
   <button class="${tab==='outdoor'?'active':''}" onclick="setBuildingTab('outdoor')">Außenanlagen</button>
 </div>
 <div style="margin-top:14px">${tab==='rooms'?roomsView(true):outdoorView()}</div>`
}
window.setBuildingTab=tab=>{state.buildingSubTab=tab;save();render()};

function outdoorView(){
 const admin=state.currentRole==='admin';
 return `<div class="section-title"><h2>Außenbereiche</h2><div class="spacer"></div>${admin?'<button class="btn primary" onclick="editOutdoor()">+ Bereich</button>':''}</div>
 <div class="room-list">${state.outdoorAreas.map(a=>`<div class="card room area-card" onclick="openOutdoor('${a.id}')"><h3>${esc(a.name)}</h3><div class="meta">${esc(a.type)} · ${a.tasks.length} Aufgaben</div><div style="margin-top:9px"><span class="pill">${a.tasks.filter(due).length} fällig</span></div></div>`).join('')}</div>`
}
window.openOutdoor=id=>{const a=state.outdoorAreas.find(x=>x.id===id);modal(`<div class="row"><div><h2>${esc(a.name)}</h2><div class="meta">${esc(a.type)}</div></div><div class="spacer"></div>${state.currentRole==='admin'?`<button class="btn tiny" onclick="closeModal();editOutdoor('${a.id}')">Bearbeiten</button>`:''}</div><div class="card" style="box-shadow:none">${a.tasks.map(t=>`<div class="task"><button class="check ${t.status==='done'?'done':''}" onclick="toggleOutdoorTask('${a.id}','${t.id}')">${t.status==='done'?'✓':''}</button><div><div class="task-title">${esc(t.title)}</div><small>${esc(intervals[t.interval]||t.interval)}</small></div></div>`).join('')}</div><div class="row wrap" style="margin-top:12px"><button class="btn danger" onclick="closeModal();addIssue('', '${a.id}')">Mangel melden</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)};
window.toggleOutdoorTask=(aid,tid)=>{const a=state.outdoorAreas.find(x=>x.id===aid),t=a.tasks.find(x=>x.id===tid);t.status=t.status==='done'?'open':'done';if(t.status==='done'){t.lastDone=nowISO();t.lastDoneBy=state.currentUserId||null}save();openOutdoor(aid)};
window.editOutdoor=id=>{const a=id?state.outdoorAreas.find(x=>x.id===id):{name:'',type:'Außenbereich',tasks:[]};modal(`<h2>${id?'Außenbereich bearbeiten':'Außenbereich anlegen'}</h2><div class="field"><label>Bezeichnung</label><input id="oaName" value="${esc(a.name)}"></div><div class="field" style="margin-top:10px"><label>Typ</label><input id="oaType" value="${esc(a.type)}"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveOutdoor('${id||''}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)};
window.saveOutdoor=id=>{const name=$('#oaName').value.trim()||'Außenbereich',type=$('#oaType').value.trim()||'Außenbereich';if(id){Object.assign(state.outdoorAreas.find(x=>x.id===id),{name,type})}else state.outdoorAreas.push({id:uid('out'),name,type,tasks:[]});save();closeModal();render()};

function roomsView(embedded=false){
 const admin=state.currentRole==='admin';
 const floors=['Alle',...new Set(state.rooms.map(r=>r.floor))];
 return `<div class="section-title"><h2>Räume</h2><div class="spacer"></div></div>
 <div class="room-toolbar-actions">
   ${admin?`<button class="btn primary" onclick="editRoom()">+ Raum anlegen</button><button class="btn soft" onclick="showTemplates()">Vorlagen</button>`:''}
   <button class="btn" onclick="showAllRoomQRs()">QR-Codes drucken / exportieren</button>
 </div>
 <div class="toolbar"><input id="roomSearch" placeholder="Raum suchen…" oninput="filterRooms()"><select id="floorFilter" onchange="filterRooms()">${floors.map(f=>`<option>${esc(f)}</option>`).join('')}</select><button class="btn" onclick="scanQR()">QR öffnen</button></div>
 <div id="roomList" class="room-list">${state.rooms.map(roomCard).join('')}</div>`
}
window.filterRooms=()=>{const q=$('#roomSearch').value.toLowerCase(),f=$('#floorFilter').value;$('#roomList').innerHTML=state.rooms.filter(r=>(f==='Alle'||r.floor===f)&&(`${r.name} ${r.type}`.toLowerCase().includes(q))).map(roomCard).join('')||'<div class="empty">Kein Raum gefunden.</div>'};
window.openRoom=id=>{state.currentRoomId=id;const r=state.rooms.find(x=>x.id===id),admin=state.currentRole==='admin';modal(`<div class="row"><div><h2>${esc(r.name)}</h2><div class="meta">${esc(r.floor)} · ${esc(r.type)}</div></div><div class="spacer"></div>${admin?`<button class="btn tiny" onclick="duplicateRoom('${r.id}')">Kopieren</button><button class="btn tiny" onclick="editRoom('${r.id}')">Bearbeiten</button>`:''}</div>${r.photo?`<img class="photo" src="${r.photo}" alt="Raumfoto">`:''}${r.notes?`<div class="notice" style="margin:12px 0">${esc(r.notes)}</div>`:''}<div class="row wrap" style="margin:12px 0"><button class="btn soft" onclick="showQR('${r.id}')">QR-Code</button><button class="btn" onclick="addIssue('${r.id}')">Hinweis/Mangel</button>${admin?`<button class="btn" onclick="addTask('${r.id}')">+ Aufgabe</button><button class="btn" onclick="pickRoomPhoto('${r.id}')">Foto</button>`:''}</div><div class="card" style="box-shadow:none">${r.tasks.map(t=>taskRow(r,t)).join('')}</div>`)};

function editRoom(id){
 const r=id?state.rooms.find(x=>x.id===id):{name:'',floor:'EG',type:'Raum',notes:'',tasks:[]};
 modal(`<h2>${id?'Raum bearbeiten':'Raum anlegen'}</h2>
 <div class="formgrid">
   <div class="field"><label>Raumname</label><input id="erName" value="${esc(r.name)}"></div>
   <div class="field"><label>Etage</label><select id="erFloor">${['Basisgeschoss','UG','EG','1. OG','2. OG','3. OG','DG','Außen'].map(f=>`<option ${r.floor===f?'selected':''}>${f}</option>`).join('')}</select></div>
   <div class="field"><label>Raumtyp</label><input id="erType" value="${esc(r.type)}"></div>
   <div class="field wide"><label>Hinweis</label><textarea id="erNotes" rows="3">${esc(r.notes||'')}</textarea></div>
 </div>
 ${id?`<div class="section-title"><h2>Aufgaben dieses Raums</h2><div class="spacer"></div><button class="btn primary tiny" onclick="closeModal();addTask('${r.id}')">+ Aufgabe</button></div>
 <div class="card" style="box-shadow:none">${r.tasks.length?r.tasks.map(t=>`<div class="edit-task-row"><div class="row"><div><b>${esc(t.title)}</b><div class="meta">${esc(intervals[t.interval]||t.interval)}</div></div><div class="spacer"></div><button class="btn tiny" onclick="closeModal();editTask('${r.id}','${t.id}')">Bearbeiten</button><button class="btn tiny danger" onclick="deleteTaskFromRoomEdit('${r.id}','${t.id}')">Löschen</button></div></div>`).join(''):'<div class="empty">Für diesen Raum sind noch keine Aufgaben hinterlegt.</div>'}</div>`:''}
 <div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveRoomEdit('${id||''}')">Raumdaten speichern</button>${id?`<button class="btn danger" onclick="deleteRoom('${id}')">Raum löschen</button>`:''}<div class="spacer"></div><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)
}
window.editRoom=editRoom;
window.saveRoomEdit=id=>{if(id){const r=state.rooms.find(x=>x.id===id);r.name=$('#erName').value.trim();r.floor=$('#erFloor').value;r.type=$('#erType').value.trim();r.notes=$('#erNotes').value.trim()}else state.rooms.push(room($('#erName').value.trim()||'Neuer Raum',$('#erFloor').value,$('#erType').value.trim()||'Raum',[],{notes:$('#erNotes').value.trim()}));save();closeModal();render()};
window.deleteRoom=id=>{if(confirm('Raum wirklich löschen?')){state.rooms=state.rooms.filter(r=>r.id!==id);save();closeModal();render()}};
window.duplicateRoom=id=>{const s=state.rooms.find(r=>r.id===id);const c=JSON.parse(JSON.stringify(s));c.id=uid('room');c.qrId=uid('qr');c.name=s.name+' – Kopie';c.tasks=c.tasks.map(x=>({...x,id:uid('task'),status:'open',lastDone:null}));state.rooms.push(c);save();closeModal();render();openRoom(c.id)};
window.addTask=id=>{modal(`<h2>Aufgabe hinzufügen</h2><div class="field"><label>Aufgabe</label><input id="atTitle"></div><div class="field" style="margin-top:10px"><label>Intervall</label><select id="atInterval">${Object.entries(intervals).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveTask('${id}')">Hinzufügen</button><button class="btn" onclick="closeModal();editRoom('${id}')">Abbrechen</button></div>`)};
window.saveTask=id=>{state.rooms.find(r=>r.id===id).tasks.push(t($('#atTitle').value.trim()||'Neue Aufgabe',$('#atInterval').value));save();closeModal();editRoom(id)};
window.editTask=(rid,tid)=>{const r=state.rooms.find(x=>x.id===rid),task=r.tasks.find(x=>x.id===tid);modal(`<h2>Aufgabe bearbeiten</h2><div class="field"><label>Aufgabe</label><input id="etTitle" value="${esc(task.title)}"></div><div class="field" style="margin-top:10px"><label>Intervall</label><select id="etInterval">${Object.entries(intervals).map(([k,v])=>`<option value="${k}" ${task.interval===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveTaskEdit('${rid}','${tid}')">Speichern</button><button class="btn danger" onclick="deleteTask('${rid}','${tid}')">Löschen</button><button class="btn" onclick="closeModal();editRoom('${rid}')">Abbrechen</button></div>`)};
window.saveTaskEdit=(rid,tid)=>{const task=state.rooms.find(r=>r.id===rid).tasks.find(t=>t.id===tid);task.title=$('#etTitle').value.trim()||'Aufgabe';task.interval=$('#etInterval').value;save();closeModal();editRoom(rid)};
window.deleteTask=(rid,tid)=>{if(!confirm('Diese Aufgabe wirklich löschen?'))return;const r=state.rooms.find(x=>x.id===rid);r.tasks=r.tasks.filter(x=>x.id!==tid);save();closeModal();editRoom(rid)};
window.deleteTaskFromRoomEdit=(rid,tid)=>{if(!confirm('Diese Aufgabe wirklich löschen?'))return;const r=state.rooms.find(x=>x.id===rid);r.tasks=r.tasks.filter(x=>x.id!==tid);save();closeModal();editRoom(rid)};

window.showTemplates=()=>modal(`<h2>Raumvorlagen</h2><div class="grid">${state.templates.map(x=>`<div class="card template-card"><div class="row"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.type)} · ${x.tasks.length} Aufgaben</div></div><div class="spacer"></div><button class="btn primary tiny" onclick="createFromTemplate('${x.id}')">Raum daraus anlegen</button></div></div>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Schließen</button></div>`);
window.createFromTemplate=id=>{const tp=state.templates.find(t=>t.id===id),r=room(tp.name,tp.floor||'1. OG',tp.type,tp.tasks.map(x=>({...x,id:uid('task'),status:'open',lastDone:null})),{notes:tp.name==='Kinderstundenraum'?'Jeder Kinderstundenraum hat ein eigenes Waschbecken.':''});state.rooms.push(r);save();closeModal();editRoom(r.id)};

function qrUrl(r){const payload=encodeURIComponent(`${location.origin}${location.pathname}?room=${r.qrId}`);return `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${payload}`}
window.showQR=id=>{const r=state.rooms.find(x=>x.id===id);modal(`<h2>QR-Code – ${esc(r.name)}</h2><div class="qrbox"><img src="${qrUrl(r)}" alt="QR-Code"><div class="meta" style="margin-top:10px">Dauerhafte Raum-ID: ${esc(r.qrId)}</div></div><p class="meta">Der QR-Code bleibt gültig, auch wenn der Raum oder die Gruppe später umbenannt wird.</p><div class="row wrap"><button class="btn primary" onclick="window.print()">Drucken</button><button class="btn" onclick="window.open(qrUrl(state.rooms.find(x=>x.id==='${r.id}')),'_blank')">QR-Bild öffnen</button><button class="btn" onclick="closeModal()">Schließen</button></div>`) };
window.scanQR=()=>{const code=prompt('QR-ID oder vollständigen Raum-Code eingeben:');if(!code)return;const r=state.rooms.find(r=>code.includes(r.qrId)||r.qrId===code);if(r)openRoom(r.id);else alert('Kein passender Raum gefunden.')};
window.showAllRoomQRs=()=>{
 const rooms=[...state.rooms].sort((a,b)=>{
   const order={'Basisgeschoss':0,'UG':1,'EG':2,'1. OG':3,'2. OG':4,'3. OG':5,'DG':9,'Außen':10};
   return (order[a.floor]??6)-(order[b.floor]??6)||a.name.localeCompare(b.name,'de');
 });
 modal(`<div class="row print-hide"><div><h2>QR-Codes – Räume</h2><div class="meta">${rooms.length} Raum-QR-Codes</div></div><div class="spacer"></div><button class="btn primary" onclick="printRoomQRSheet()">Drucken / als PDF sichern</button><button class="btn" onclick="exportRoomQRList()">Liste exportieren</button></div>
 <div class="qr-sheet">${rooms.map(r=>`<div class="qr-label"><img src="${qrUrl(r)}" alt="QR ${esc(r.name)}"><b>${esc(r.name)}</b><small>${esc(r.floor)} · ${esc(r.type)}</small><small>Raum-ID: ${esc(r.qrId)}</small></div>`).join('')}</div>
 <div class="row print-hide" style="margin-top:14px"><button class="btn" onclick="closeModal()">Schließen</button></div>`)
};
window.printRoomQRSheet=()=>{
 document.body.classList.add('qr-print-mode');
 window.print();
 setTimeout(()=>document.body.classList.remove('qr-print-mode'),1000);
};
window.exportRoomQRList=()=>{
 const rows=[['Geschoss','Raum','Raumtyp','Raum-ID','QR-Link'],...state.rooms.map(r=>[r.floor,r.name,r.type,r.qrId,`${location.origin}${location.pathname}?room=${encodeURIComponent(r.qrId)}`])];
 const csv=rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='ECG_Raum_QR_Codes.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};

function openFromQuery(){const p=new URLSearchParams(location.search),q=p.get('room'),asset=p.get('asset');if(q){const r=state.rooms.find(r=>r.qrId===q);if(r){state.activeTab='building';state.buildingSubTab='rooms';setTimeout(()=>openRoom(r.id),150)}}if(asset){const a=state.inventory?.find(a=>a.assetId===asset);if(a){state.activeTab='inventory';state.inventorySubTab='assets';setTimeout(()=>openAsset(a.id),150)}}}

function addIssue(rid, outdoorId='', assetId=''){pendingPhoto=null;modal(`<h2>Hinweis / Mangel melden</h2><div class="formgrid"><div class="field"><label>Raum</label><select id="isRoom"><option value="">Allgemein</option>${state.rooms.map(x=>`<option value="${x.id}" ${rid===x.id?'selected':''}>${esc(x.floor)} – ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Außenbereich</label><select id="isOutdoor"><option value="">–</option>${state.outdoorAreas.map(x=>`<option value="${x.id}" ${outdoorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Inventar</label><select id="isAsset"><option value="">–</option>${(state.inventory||[]).map(x=>`<option value="${x.id}" ${assetId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Priorität</label><select id="isPri"><option>normal</option><option>hoch</option><option>dringend</option></select></div><div class="field wide"><label>Beschreibung</label><textarea id="isText" rows="4"></textarea></div><div class="field wide"><label>Foto</label><button class="btn" onclick="captureIssuePhoto()">Foto aufnehmen/auswählen</button><div id="photoPreview"></div></div></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveIssue()">Melden</button><button class="btn" onclick="pendingPhoto=null;closeModal()">Abbrechen</button></div>`)}
window.addIssue=addIssue; let pendingPhoto=null;
window.captureIssuePhoto=()=>{$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{try{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingPhoto=c.toDataURL('image/jpeg',.78);$('#photoPreview').innerHTML=`<img class="photo" src="${pendingPhoto}">`}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);alert('Das Foto konnte nicht verarbeitet werden. Bitte ein anderes Foto auswählen.')};img.src=url};$('#photoInput').value='';$('#photoInput').click()};
window.saveIssue=()=>{const issue={id:uid('issue'),roomId:$('#isRoom')?.value||'',outdoorId:$('#isOutdoor')?.value||'',assetId:$('#isAsset')?.value||'',priority:$('#isPri')?.value||'normal',text:$('#isText')?.value.trim()||'',status:'open',created:nowISO(),photo:pendingPhoto};if(!issue.text){alert('Bitte eine kurze Beschreibung eingeben.');return}state.issues=state.issues||[];state.issues.unshift(issue);try{save()}catch(err){state.issues.shift();console.error(err);alert('Der Mangel konnte nicht gespeichert werden. Bitte die Seite neu laden und erneut versuchen. Falls ein Foto verwendet wurde, bitte ohne Foto testen.');return}pendingPhoto=null;closeModal();state.activeTab='issues';render()};

function issueLocation(i){
 const r=state.rooms.find(x=>x.id===i.roomId),o=state.outdoorAreas.find(x=>x.id===i.outdoorId),a=state.inventory.find(x=>x.id===i.assetId);
 return r?`${r.floor} – ${r.name}`:o?o.name:a?`Inventar – ${a.name}`:'Allgemein'
}
window.openIssue=id=>{const i=state.issues.find(x=>x.id===id);if(!i)return;modal(`<div class="row"><div><h2>Mangel / Hinweis</h2><div class="meta">${esc(issueLocation(i))} · ${new Date(i.created).toLocaleString('de-DE')}</div></div><div class="spacer"></div><span class="pill ${i.priority==='dringend'?'danger':i.priority==='hoch'?'warn':''}">${esc(i.priority)}</span></div><div class="card" style="box-shadow:none;margin-top:12px"><p>${esc(i.text||'Keine Beschreibung')}</p>${i.photo?`<img class="photo" src="${i.photo}">`:''}</div><div class="field" style="margin-top:12px"><label>Status</label><select id="issueQuickStatus" onchange="setIssueAndStay('${i.id}',this.value)"><option value="open" ${i.status==='open'?'selected':''}>offen</option><option value="work" ${i.status==='work'?'selected':''}>in Arbeit</option><option value="done" ${i.status==='done'?'selected':''}>erledigt</option></select></div><div class="row wrap" style="margin-top:14px"><button class="btn primary" onclick="closeModal();editIssue('${i.id}')">Bearbeiten</button><button class="btn ${i.status==='done'?'':'soft'}" onclick="markIssueDone('${i.id}')">${i.status==='done'?'Erledigt ✓':'Als erledigt markieren'}</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)};
window.editIssue=id=>{const i=state.issues.find(x=>x.id===id);pendingPhoto=i.photo||null;modal(`<h2>Mangel bearbeiten</h2><div class="formgrid"><div class="field"><label>Raum</label><select id="eiRoom"><option value="">Allgemein</option>${state.rooms.map(x=>`<option value="${x.id}" ${i.roomId===x.id?'selected':''}>${esc(x.floor)} – ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Außenbereich</label><select id="eiOutdoor"><option value="">–</option>${state.outdoorAreas.map(x=>`<option value="${x.id}" ${i.outdoorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Inventar</label><select id="eiAsset"><option value="">–</option>${state.inventory.map(x=>`<option value="${x.id}" ${i.assetId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Priorität</label><select id="eiPri">${['normal','hoch','dringend'].map(x=>`<option ${i.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="eiStatus"><option value="open" ${i.status==='open'?'selected':''}>offen</option><option value="work" ${i.status==='work'?'selected':''}>in Arbeit</option><option value="done" ${i.status==='done'?'selected':''}>erledigt</option></select></div><div class="field wide"><label>Beschreibung</label><textarea id="eiText" rows="5">${esc(i.text||'')}</textarea></div><div class="field wide"><label>Foto</label><button class="btn" onclick="captureIssuePhoto()">Foto ändern</button><div id="photoPreview">${i.photo?`<img class="photo" src="${i.photo}">`:''}</div></div></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveIssueEdit('${i.id}')">Speichern</button><button class="btn" onclick="closeModal();openIssue('${i.id}')">Abbrechen</button></div>`)};
window.saveIssueEdit=id=>{const i=state.issues.find(x=>x.id===id);Object.assign(i,{roomId:$('#eiRoom').value,outdoorId:$('#eiOutdoor').value,assetId:$('#eiAsset').value,priority:$('#eiPri').value,status:$('#eiStatus').value,text:$('#eiText').value.trim(),photo:pendingPhoto});pendingPhoto=null;save();closeModal();openIssue(id)};
window.setIssue=(id,v)=>{state.issues.find(i=>i.id===id).status=v;save();render()};
window.setIssueAndStay=(id,v)=>{state.issues.find(i=>i.id===id).status=v;save();closeModal();openIssue(id)};
window.markIssueDone=id=>{state.issues.find(i=>i.id===id).status='done';save();closeModal();openIssue(id)};
window.showOpenIssues=()=>{const open=state.issues.filter(i=>i.status!=='done');if(open.length===1){openIssue(open[0].id);return}state.activeTab='issues';save();render()};

function issuesView(){
 const sorted=[...state.issues].sort((a,b)=>(a.status==='done')-(b.status==='done')||new Date(b.created)-new Date(a.created));
 return `<div class="section-title"><h2>Hinweise & Mängel</h2><div class="spacer"></div><button class="btn primary" onclick="addIssue()">+ Hinweis</button></div><div class="card">${sorted.length?sorted.map(i=>`<div class="issue" onclick="openIssue('${i.id}')"><div class="row"><span class="pill ${i.priority==='dringend'?'danger':i.priority==='hoch'?'warn':''}">${esc(i.priority)}</span><b>${esc(issueLocation(i))}</b><div class="spacer"></div><select class="btn tiny" onclick="event.stopPropagation()" onchange="setIssue('${i.id}',this.value)"><option value="open" ${i.status==='open'?'selected':''}>offen</option><option value="work" ${i.status==='work'?'selected':''}>in Arbeit</option><option value="done" ${i.status==='done'?'selected':''}>erledigt</option></select></div><div style="margin-top:7px">${esc(i.text)}</div>${i.photo?`<img class="photo" src="${i.photo}">`:''}<div class="row" style="margin-top:8px"><div class="meta">${new Date(i.created).toLocaleString('de-DE')}</div><div class="spacer"></div><button class="btn tiny" onclick="event.stopPropagation();editIssue('${i.id}')">Bearbeiten</button></div></div>`).join(''):'<div class="empty">Noch keine Hinweise.</div>'}</div>`
}

function inventoryView(){
 const tab=state.inventorySubTab||'assets';
 return `<div class="section-title"><h2>Inventar & Betriebsmittel</h2></div>
 <div class="segmented">
  <button class="${tab==='assets'?'active':''}" onclick="setInventoryTab('assets')">Inventar</button>
  <button class="${tab==='materials'?'active':''}" onclick="setInventoryTab('materials')">Verbrauchsmaterial</button>
  <button class="${tab==='locations'?'active':''}" onclick="setInventoryTab('locations')">Lagerorte</button>
 </div>
 <div style="margin-top:14px">${tab==='assets'?assetsView():tab==='materials'?materialsView():locationsView()}</div>`
}
window.setInventoryTab=tab=>{state.inventorySubTab=tab;save();render()};

function assetsView(){
 const admin=state.currentRole==='admin';
 return `<div class="section-title"><h2>Inventar</h2><div class="spacer"></div>${admin?'<button class="btn primary" onclick="editAsset()">+ Inventar</button>':''}</div>
 <div class="toolbar"><input id="assetSearch" placeholder="Inventar suchen…" oninput="filterAssets()"><select id="assetLocation" onchange="filterAssets()"><option value="">Alle Lagerorte</option>${state.storageLocations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select><button class="btn" onclick="scanAssetQR()">QR öffnen</button>${admin?'<button class="btn" onclick="printAllAssetQR()">Alle QR drucken / PDF</button>':''}</div>
 <div id="assetGrid" class="inventory-grid">${state.inventory.length?state.inventory.map(assetCard).join(''):'<div class="card empty">Noch kein Inventar erfasst. Über „+ Inventar“ können Werkzeuge, Geräte, Maschinen und sonstige Gegenstände mit eigenem QR-Code angelegt werden.</div>'}</div>`
}
function assetCard(a){
 const loc=state.storageLocations.find(l=>l.id===a.locationId),room=state.rooms.find(r=>r.id===a.roomId),admin=state.currentRole==='admin';
 const where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');
 return `<div class="card" data-asset="${esc((a.name+' '+(a.category||'')+' '+where).toLowerCase())}" data-location="${esc(a.locationId||'')}">
   <div class="asset-photo">${a.photo?`<img src="${a.photo}">`:'◇'}</div>
   <div class="row" style="margin-top:10px"><div><b>${esc(a.name)}</b><div class="meta">${esc(a.category||'Inventar')} · ${esc(where)}</div></div><div class="spacer"></div><span class="pill">${esc(a.condition||'in Ordnung')}</span></div>
   <div style="margin-top:8px"><span class="asset-code">${esc(a.assetId)}</span></div>
   <div class="asset-actions">
     <button class="btn tiny" onclick="openAsset('${a.id}')">Öffnen</button>
     <button class="btn tiny" onclick="showAssetQR('${a.id}')">QR-Code</button>
     ${admin?`<button class="btn tiny" onclick="editAsset('${a.id}')">Bearbeiten</button>`:''}
   </div>
 </div>`
}
window.filterAssets=()=>{const q=($('#assetSearch').value||'').toLowerCase(),loc=$('#assetLocation').value;document.querySelectorAll('[data-asset]').forEach(el=>el.style.display=(!q||el.dataset.asset.includes(q))&&(!loc||el.dataset.location===loc)?'':'none')};
window.editAsset=id=>{
 if(state.currentRole!=='admin'){alert('Nur Administratoren können Inventar bearbeiten.');return}
 const a=id?state.inventory.find(x=>x.id===id):{name:'',category:'Werkzeug',locationId:'',roomId:'',manufacturer:'',model:'',serial:'',condition:'in Ordnung',purchaseDate:'',nextMaintenance:'',notes:'',photo:''};
 modal(`<h2>${id?'Inventar bearbeiten':'Inventar anlegen'}</h2>
 <div class="formgrid">
   <div class="field"><label>Bezeichnung</label><input id="asName" value="${esc(a.name)}"></div>
   <div class="field"><label>Kategorie</label><input id="asCat" value="${esc(a.category)}" placeholder="Werkzeug, Maschine, Gerät…"></div>
   <div class="field wide"><label>Raum zuordnen</label><select id="asRoom" onchange="assetRoomChanged()"><option value="">Kein Raum</option>${state.rooms.map(r=>`<option value="${r.id}" ${a.roomId===r.id?'selected':''}>${esc(r.floor)} – ${esc(r.name)}</option>`).join('')}</select><div class="asset-room-note">Hier kannst du direkt einen bereits hinterlegten Raum auswählen.</div></div>
   <div class="field wide"><label>Alternativer Lagerort</label><select id="asLoc" onchange="assetLocationChanged()"><option value="">Kein separater Lagerort</option>${state.storageLocations.map(l=>`<option value="${l.id}" ${a.locationId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select><div class="asset-room-note">Für Garagen, Lager oder sonstige Orte außerhalb der Raumliste.</div></div>
   <div class="field"><label>Hersteller</label><input id="asMan" value="${esc(a.manufacturer||'')}"></div>
   <div class="field"><label>Modell</label><input id="asModel" value="${esc(a.model||'')}"></div>
   <div class="field"><label>Seriennummer</label><input id="asSerial" value="${esc(a.serial||'')}"></div>
   <div class="field"><label>Zustand</label><select id="asCond">${['in Ordnung','Wartung fällig','defekt','außer Betrieb'].map(x=>`<option ${a.condition===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="field"><label>Kaufdatum</label><input id="asBuy" type="date" value="${esc(a.purchaseDate||'')}"></div>
   <div class="field"><label>Nächste Wartung/Prüfung</label><input id="asMaint" type="date" value="${esc(a.nextMaintenance||'')}"></div>
   <div class="field wide"><label>Notizen</label><textarea id="asNotes">${esc(a.notes||'')}</textarea></div>
   <div class="field wide"><label>Foto</label><button class="btn" onclick="captureAssetPhoto()">Foto aufnehmen/auswählen</button><div id="assetPhotoPreview">${a.photo?`<img class="photo" src="${a.photo}">`:''}</div></div>
   ${id?`<div class="field wide"><label>QR-Code</label><div class="row wrap"><span class="asset-code">${esc(a.assetId)}</span><button class="btn" onclick="closeModal();showAssetQR('${a.id}')">QR öffnen / drucken / exportieren</button></div></div>`:`<div class="field wide"><label>QR-Code</label><div class="notice">Beim Speichern wird automatisch eine dauerhafte Inventar-ID und der dazugehörige QR-Code erzeugt.</div></div>`}
 </div>
 <div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveAsset('${id||''}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`);
 pendingAssetPhoto=a.photo||''
};
window.assetRoomChanged=()=>{if($('#asRoom').value)$('#asLoc').value=''};
window.assetLocationChanged=()=>{if($('#asLoc').value)$('#asRoom').value=''};
let pendingAssetPhoto='';
window.captureAssetPhoto=()=>{$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{pendingAssetPhoto=rd.result;$('#assetPhotoPreview').innerHTML=`<img class="photo" src="${pendingAssetPhoto}">`};rd.readAsDataURL(f)};$('#photoInput').click()};
window.saveAsset=id=>{
 const roomId=$('#asRoom').value,locationId=$('#asLoc').value;
 const data={name:$('#asName').value.trim()||'Inventar',category:$('#asCat').value.trim()||'Inventar',roomId,locationId,manufacturer:$('#asMan').value.trim(),model:$('#asModel').value.trim(),serial:$('#asSerial').value.trim(),condition:$('#asCond').value,purchaseDate:$('#asBuy').value,nextMaintenance:$('#asMaint').value,notes:$('#asNotes').value.trim(),photo:pendingAssetPhoto};
 let asset;
 if(id){asset=state.inventory.find(x=>x.id===id);Object.assign(asset,data)}
 else{asset={id:uid('asset'),assetId:uid('ECG'),...data,history:[]};state.inventory.push(asset)}
 save();closeModal();
 if(!id && confirm('Inventar wurde angelegt. QR-Code jetzt öffnen?'))showAssetQR(asset.id);else render()
};
window.openAsset=id=>{
 const a=state.inventory.find(x=>x.id===id),loc=state.storageLocations.find(l=>l.id===a.locationId),room=state.rooms.find(r=>r.id===a.roomId);
 const where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');
 modal(`<div class="row"><div><h2>${esc(a.name)}</h2><div class="meta">${esc(a.category||'')} · ${esc(where)}</div></div><div class="spacer"></div>${state.currentRole==='admin'?`<button class="btn tiny" onclick="closeModal();editAsset('${a.id}')">Bearbeiten</button>`:''}</div>
 ${a.photo?`<img class="photo" src="${a.photo}">`:''}
 <div class="card" style="box-shadow:none;margin-top:12px"><div class="meta">Inventar-ID</div><b class="asset-code">${esc(a.assetId)}</b><p><b>Zuordnung:</b> ${esc(where)}</p><p><b>Zustand:</b> ${esc(a.condition||'')}</p>${a.manufacturer||a.model?`<p><b>Gerät:</b> ${esc([a.manufacturer,a.model].filter(Boolean).join(' '))}</p>`:''}${a.serial?`<p><b>Seriennummer:</b> ${esc(a.serial)}</p>`:''}${a.nextMaintenance?`<p><b>Nächste Wartung/Prüfung:</b> ${esc(a.nextMaintenance)}</p>`:''}${a.notes?`<p>${esc(a.notes)}</p>`:''}</div>
 <div class="row wrap" style="margin-top:12px"><button class="btn" onclick="showAssetQR('${a.id}')">QR-Code</button><button class="btn danger" onclick="closeModal();addIssue('', '', '${a.id}')">Mangel melden</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)
};
function assetQrUrl(a){const payload=encodeURIComponent(`${location.origin}${location.pathname}?asset=${a.assetId}`);return `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${payload}`}
window.showAssetQR=id=>{
 const a=state.inventory.find(x=>x.id===id),room=state.rooms.find(r=>r.id===a.roomId),loc=state.storageLocations.find(l=>l.id===a.locationId),where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');
 modal(`<h2>QR-Code – ${esc(a.name)}</h2>
 <div class="qrbox"><img id="assetQrImage" src="${assetQrUrl(a)}"><div style="margin-top:10px"><b>${esc(a.name)}</b></div><div class="meta">${esc(where)}</div><div class="meta">Dauerhafte Inventar-ID: ${esc(a.assetId)}</div></div>
 <p class="meta">Der QR-Code bleibt gültig, auch wenn Bezeichnung, Raum oder Lagerort später geändert werden.</p>
 <div class="qr-actions no-print">
   <button class="btn primary" onclick="printAssetQR()">Direkt drucken</button>
   <button class="btn" onclick="downloadAssetQR('${a.id}')">QR als Bild exportieren</button>
   <button class="btn" onclick="printAssetQR()">Als PDF speichern</button>
   <button class="btn" onclick="closeModal()">Schließen</button>
 </div>
 <p class="meta no-print">„Als PDF speichern“ öffnet den Druckdialog. Dort kannst du auf iPhone, iPad, Mac oder PC „Als PDF sichern“ wählen.</p>`)
};
window.printAssetQR=()=>window.print();
window.downloadAssetQR=id=>{
 const a=state.inventory.find(x=>x.id===id),url=assetQrUrl(a);
 const link=document.createElement('a');link.href=url;link.download=`QR-${a.assetId}-${(a.name||'Inventar').replace(/[^a-z0-9_-]+/gi,'_')}.png`;link.target='_blank';document.body.appendChild(link);link.click();link.remove()
};
window.scanAssetQR=()=>{const code=prompt('Inventar-ID oder vollständigen QR-Code eingeben:');if(!code)return;const a=state.inventory.find(a=>code.includes(a.assetId)||a.assetId===code);if(a)openAsset(a.id);else alert('Kein passendes Inventar gefunden.')};

window.printAllAssetQR=()=>{
 if(!state.inventory.length){alert('Noch kein Inventar vorhanden.');return}
 modal(`<h2>Inventar-QR-Codes</h2><div class="meta no-print">Alle Inventar-QR-Codes als Etikettenbogen. Über Drucken kann der Bogen auch als PDF gespeichert werden.</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:14px">${state.inventory.map(a=>{const room=state.rooms.find(r=>r.id===a.roomId),loc=state.storageLocations.find(l=>l.id===a.locationId),where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');return `<div style="border:1px solid #ddd;padding:12px;text-align:center;border-radius:10px;break-inside:avoid"><img src="${assetQrUrl(a)}" style="width:135px;height:135px"><div><b>${esc(a.name)}</b></div><div class="meta">${esc(where)}</div><div class="meta">${esc(a.assetId)}</div></div>`}).join('')}</div>
 <div class="row no-print" style="margin-top:14px"><button class="btn primary" onclick="window.print()">Drucken / als PDF</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)
};

function locationsView(){return `<div class="section-title"><h2>Lagerorte</h2><div class="spacer"></div>${state.currentRole==='admin'?'<button class="btn primary" onclick="editLocation()">+ Lagerort</button>':''}</div><div class="card">${state.storageLocations.map(l=>`<div class="user-row"><div><b>${esc(l.name)}</b><div class="meta">${esc(l.owner||'Gemeinde')} · ${state.inventory.filter(a=>a.locationId===l.id).length} Inventargegenstände · ${state.materials.filter(m=>m.location===l.name).length} Materialartikel</div></div>${state.currentRole==='admin'?`<button class="btn tiny" onclick="editLocation('${l.id}')">Bearbeiten</button>`:''}</div>`).join('')}</div>`}
window.editLocation=id=>{const l=id?state.storageLocations.find(x=>x.id===id):{name:'',owner:'Gemeinde'};modal(`<h2>${id?'Lagerort bearbeiten':'Lagerort anlegen'}</h2><div class="field"><label>Bezeichnung</label><input id="locName" value="${esc(l.name)}"></div><div class="field" style="margin-top:10px"><label>Zuordnung</label><input id="locOwner" value="${esc(l.owner||'Gemeinde')}"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveLocation('${id||''}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)};
window.saveLocation=id=>{const name=$('#locName').value.trim()||'Lagerort',owner=$('#locOwner').value.trim()||'Gemeinde';if(id)Object.assign(state.storageLocations.find(x=>x.id===id),{name,owner});else state.storageLocations.push({id:uid('loc'),name,owner});save();closeModal();render()};

function materialsView(){const low=state.materials.filter(m=>m.qty<m.min);return `<div class="section-title"><h2>Material & Lager</h2><div class="spacer"></div>${state.currentRole==='admin'?'<button class="btn primary" onclick="editMaterial()">+ Artikel</button>':''}</div>${low.length?`<div class="notice">${low.length} Artikel liegen unter dem Mindestbestand. Sie können direkt auf die Einkaufsliste gesetzt werden.</div>`:''}<div class="card" style="margin-top:12px;overflow:auto"><table class="material-table"><thead><tr><th>Artikel</th><th>Lagerort</th><th>Bestand</th><th>Min.</th><th></th></tr></thead><tbody>${state.materials.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.location)}</td><td class="${m.qty<m.min?'low':''}">${m.qty} ${esc(m.unit)}</td><td>${m.min}</td><td><div class="row"><button class="btn tiny" onclick="moveQty('${m.id}',-1)">−</button><button class="btn tiny" onclick="moveQty('${m.id}',1)">+</button>${m.qty<m.min?`<button class="btn soft tiny" onclick="toShopping('${m.id}')">Einkauf</button>`:''}</div></td></tr>`).join('')}</tbody></table></div><div class="section-title"><h2>Einkaufsliste</h2></div><div class="card">${state.shopping.length?state.shopping.map(x=>`<div class="task"><button class="check" onclick="removeShopping('${x.id}')"></button><div><div class="task-title">${esc(x.name)}</div><small>${x.amount} ${esc(x.unit)} · Zielbestand ${x.target}</small></div></div>`).join(''):'<div class="empty">Einkaufsliste ist leer.</div>'}</div>`}
window.moveQty=(id,d)=>{const m=state.materials.find(x=>x.id===id);m.qty=Math.max(0,m.qty+d);save();render()};
window.toShopping=id=>{const m=state.materials.find(x=>x.id===id);if(!state.shopping.find(x=>x.materialId===id))state.shopping.push({id:uid('shop'),materialId:id,name:m.name,amount:Math.max(1,m.target-m.qty),unit:m.unit,target:m.target});save();render()};
window.removeShopping=id=>{state.shopping=state.shopping.filter(x=>x.id!==id);save();render()};
window.editMaterial=()=>modal(`<h2>Material anlegen</h2><div class="formgrid"><div class="field"><label>Artikel</label><input id="mName"></div><div class="field"><label>Lagerort</label><input id="mLoc" placeholder="z. B. Putzschrank EG"></div><div class="field"><label>Bestand</label><input id="mQty" type="number" value="0"></div><div class="field"><label>Einheit</label><input id="mUnit" value="Stk."></div><div class="field"><label>Mindestbestand</label><input id="mMin" type="number" value="1"></div><div class="field"><label>Sollbestand</label><input id="mTarget" type="number" value="5"></div></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveMaterial()">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`);
window.saveMaterial=()=>{state.materials.push({id:uid('mat'),name:$('#mName').value,location:$('#mLoc').value,qty:+$('#mQty').value,min:+$('#mMin').value,target:+$('#mTarget').value,unit:$('#mUnit').value});save();closeModal();render()};


function calendarView(){
 const events=(state.calendarEvents||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
 const admin=state.currentRole==='admin';
 return `<div class="section-title"><h2>Kalender & Veranstaltungen</h2></div>

 <div class="notice" style="margin-top:10px"><b>${esc(CALENDAR_SYNC_NOTE)}</b><br>Die App ist für die automatische Google-Calendar-Synchronisierung vorbereitet. Für die veröffentlichte Web-App muss die Google-Anmeldung einmal serverseitig freigeschaltet werden; bis dahin wird der zuletzt eingelesene Kalenderstand verwendet.</div>

window.editEventRule=id=>{const r=id?state.eventRules.find(x=>x.id===id):{label:'',keyword:'',roomMatch:[],tasks:[]};modal(`<h2>${id?'Regel bearbeiten':'Regel anlegen'}</h2><div class="formgrid"><div class="field"><label>Name</label><input id="erLabel" value="${esc(r.label||'')}"></div><div class="field"><label>Kalendertext enthält</label><input id="erKeyword" value="${esc(r.keyword||'')}"></div><div class="field wide"><label>Räume / Raumtypen (mit Komma trennen)</label><input id="erRooms" value="${esc((r.roomMatch||[]).join(', '))}" placeholder="z. B. Jugendraum, Foyer"></div><div class="field wide"><label>Aufgaben (eine pro Zeile)</label><textarea id="erTasks" style="min-height:150px">${esc((r.tasks||[]).join('\n'))}</textarea></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveEventRule('${id||''}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)};
window.saveEventRule=id=>{const data={label:$('#erLabel').value.trim(),keyword:$('#erKeyword').value.trim(),roomMatch:$('#erRooms').value.split(',').map(x=>x.trim()).filter(Boolean),tasks:$('#erTasks').value.split('\n').map(x=>x.trim()).filter(Boolean)};if(!data.label||!data.keyword){alert('Bitte Name und Kalendertext eintragen.');return}if(id)Object.assign(state.eventRules.find(x=>x.id===id),data);else state.eventRules.push({id:uid('erule'),...data});save();closeModal();render()};

window.showUserManagement=()=>{

 const users=state.users||[];
 modal(`<div class="row"><div><h2>Benutzerverwaltung</h2><div class="meta">Benutzer, Rollen und Zugänge verwalten</div></div><div class="spacer"></div><button class="btn primary" onclick="closeModal();editUser()">+ Benutzer</button></div>
 <div class="notice" style="margin:12px 0">Rollen bestimmen, welche Bereiche bearbeitet werden dürfen. Benutzer können deaktiviert werden, ohne ihre bisherigen Zeiterfassungen oder Zuordnungen zu verlieren.</div>
 <div class="user-admin-grid">${users.map(u=>`<div class="user-admin-card ${u.active===false?'inactive':''}">
   <div class="row"><div><b>${esc(u.name)}</b><div class="meta">${esc(u.email||'keine E-Mail hinterlegt')}</div></div><div class="spacer"></div><span class="pill ${u.active===false?'warn':'ok'}">${u.active===false?'inaktiv':'aktiv'}</span></div>
   <div class="role"><span class="pill">${esc(roleLabels[u.role])}</span></div>
   <div class="row wrap" style="margin-top:12px">
     <button class="btn tiny" onclick="loginAs('${u.id}');closeModal()">${state.currentUserId===u.id?'Aktiver Benutzer':'Als Benutzer wechseln'}</button>
     <button class="btn tiny" onclick="closeModal();editUser('${u.id}')">Bearbeiten</button>
     ${u.id!==state.currentUserId?`<button class="btn tiny danger" onclick="deleteUser('${u.id}')">Löschen</button>`:''}
   </div>
 </div>`).join('')}</div>
 <div class="section-title"><h2>Rollen</h2></div>
 <div class="card" style="box-shadow:none">
   <div class="user-row"><div><b>Admin</b><div class="meta">Volle Verwaltung: Räume, Aufgaben, Mängel, Inventar, Benutzer, Kalenderregeln und Auswertungen.</div></div></div>
   <div class="user-row"><div><b>Putzkraft</b><div class="meta">Aufgaben abarbeiten, Mängel melden und eigene Zeiten erfassen.</div></div></div>
   <div class="user-row"><div><b>Vertretung</b><div class="meta">Wie Putzkraft, für zeitweise Vertretung vorgesehen.</div></div></div>
   <div class="user-row"><div><b>Ehrenamtlich</b><div class="meta">Für freiwillige Helfer mit einfachem Zugriff auf zugewiesene Aufgaben und Meldungen.</div></div></div>
 </div>
 <div class="notice" style="margin-top:12px">Die sichere Anmeldung per Einmal-Link oder Code wird erst mit der Cloud-Authentifizierung aktiv. In dieser Einzeldatei funktioniert die Benutzerzuordnung bereits lokal.</div>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">Schließen</button></div>`)
};
window.showFloorPlan=name=>modal(`<h2>Grundriss – ${esc(name)}</h2><img src="${floorPlans[name]}" style="width:100%;max-height:72vh;object-fit:contain;border:1px solid var(--line);border-radius:12px"><div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">Schließen</button></div>`);
window.loginDialog=()=>{const u=currentUser();modal(`<h2>Benutzer</h2>${u?`<div class="card" style="box-shadow:none">${userSummaryCard(u)}</div>`:''}<div class="field" style="margin-top:12px"><label>Mit E-Mail wechseln / anmelden</label><input id="loginEmail" type="email" placeholder="name@beispiel.de"></div><div class="row wrap" style="margin-top:12px"><button class="btn primary" onclick="loginByEmail()">Anmelden</button>${state.currentRole==='admin'?`<button class="btn" onclick="closeModal();showUserManagement()">Benutzerverwaltung</button>`:''}<button class="btn" onclick="closeModal()">Schließen</button></div><p class="meta">Lokaler Testmodus: Die E-Mail wird mit der Benutzerliste abgeglichen. Für eine sichere Anmeldung per Einmal-Link oder Code wird die Cloud-Authentifizierung verwendet.</p>`)};
window.loginByEmail=()=>{const email=($('#loginEmail').value||'').trim().toLowerCase();const u=state.users.find(x=>(x.email||'').toLowerCase()===email&&x.active!==false);if(!u){alert('Für diese E-Mail ist noch kein Benutzer angelegt.');return}state.currentUserId=u.id;state.currentRole=u.role;save();closeModal();render()};
window.loginAs=id=>{const u=state.users.find(x=>x.id===id);if(!u)return;state.currentUserId=id;state.currentRole=u.role;save();render()};
window.editUser=id=>{
 if(state.currentRole!=='admin'){alert('Nur Administratoren können Benutzer verwalten.');return}
 const u=id?state.users.find(x=>x.id===id):{name:'',email:'',role:'cleaner',active:true};
 modal(`<h2>${id?'Benutzer bearbeiten':'Benutzer anlegen'}</h2>
 <div class="formgrid">
   <div class="field"><label>Name</label><input id="uName" value="${esc(u.name)}" placeholder="Vor- und Nachname"></div>
   <div class="field"><label>E-Mail</label><input id="uEmail" type="email" value="${esc(u.email)}" placeholder="name@beispiel.de"></div>
   <div class="field"><label>Rolle</label><select id="uRole">${Object.entries(roleLabels).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
   <div class="field"><label>Status</label><select id="uActive"><option value="yes" ${u.active!==false?'selected':''}>Aktiv</option><option value="no" ${u.active===false?'selected':''}>Deaktiviert</option></select></div>
 </div>
 <div class="notice" style="margin-top:12px">Deaktivieren ist besser als Löschen, wenn bereits Zeiten, Mängel oder andere Einträge zu diesem Benutzer existieren.</div>
 <div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveUser('${id||''}')">Speichern</button>${id&&id!==state.currentUserId?`<button class="btn danger" onclick="deleteUser('${id}')">Löschen</button>`:''}<div class="spacer"></div><button class="btn" onclick="closeModal();showUserManagement()">Abbrechen</button></div>`)
};
window.saveUser=id=>{
 if(state.currentRole!=='admin'){alert('Nur Administratoren können Benutzer verwalten.');return}
 const name=$('#uName').value.trim(),email=$('#uEmail').value.trim().toLowerCase(),role=$('#uRole').value,active=$('#uActive').value==='yes';
 if(!name||!email){alert('Bitte Name und E-Mail eintragen.');return}
 if(state.users.some(x=>x.id!==id&&(x.email||'').toLowerCase()===email)){alert('Diese E-Mail ist bereits vergeben.');return}
 if(id){
   const target=state.users.find(x=>x.id===id);
   if(!target)return;
   if(id===state.currentUserId && active===false){alert('Den aktuell angemeldeten Benutzer kannst du nicht deaktivieren.');return}
   const remainingAdmins=state.users.filter(x=>x.id!==id&&x.role==='admin'&&x.active!==false);
   if(target.role==='admin' && (role!=='admin'||active===false) && remainingAdmins.length===0){alert('Mindestens ein aktiver Administrator muss erhalten bleiben.');return}
   Object.assign(target,{name,email,role,active});
 }else{
   state.users.push({id:uid('user'),name,email,role,active,created:nowISO()});
 }
 const cu=currentUser();if(cu)state.currentRole=cu.role;
 save();closeModal();showUserManagement()
};
window.deleteUser=id=>{
 if(state.currentRole!=='admin'){alert('Nur Administratoren können Benutzer verwalten.');return}
 const u=state.users.find(x=>x.id===id);if(!u)return;
 if(id===state.currentUserId){alert('Der aktuell angemeldete Benutzer kann nicht gelöscht werden.');return}
 if(u.role==='admin'&&state.users.filter(x=>x.id!==id&&x.role==='admin'&&x.active!==false).length===0){alert('Mindestens ein aktiver Administrator muss erhalten bleiben.');return}
 const hasHistory=(state.timeEntries||[]).some(e=>e.userId===id);
 if(hasHistory&&!confirm(`${u.name} hat bereits Zeiterfassungen. Wirklich löschen? Deaktivieren wäre sicherer.`))return;
 if(!hasHistory&&!confirm(`${u.name} wirklich löschen?`))return;
 state.users=state.users.filter(x=>x.id!==id);save();closeModal();showUserManagement()
};
window.showTimeReport=()=>modal(`<h2>Zeiterfassungsübersicht</h2><div class="card" style="box-shadow:none">${(state.timeEntries||[]).length?state.timeEntries.map(e=>{const u=state.users.find(x=>x.id===e.userId);return `<div class="task"><div></div><div><div class="task-title">${esc(timeEntryLabel(e))}</div><small>${esc(u?.name||'Benutzer')}${u?.email?` · ${esc(u.email)}`:''} · ${new Date(e.start).toLocaleString('de-DE')} – ${new Date(e.end).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} · ${fmtDuration(new Date(e.end)-new Date(e.start))}${e.note?` · ${esc(e.note)}`:''}</small></div></div>`}).join(''):'<div class="empty">Noch keine Arbeitszeiten erfasst.</div>'}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">Schließen</button></div>`);

window.toggleCloud=async v=>{state.settings.cloudSync=v;save();if(v)await pullCloud();render()}; window.toggleTime=v=>{state.settings.personalTimeTracking=v;save();render()};
window.exportData=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`reinigung-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
window.importData=()=>{$('#fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.version)throw 0;state=x;save();render();alert('Backup importiert.')}catch{alert('Ungültige Backup-Datei.')}};r.readAsText(f)};$('#fileImport').click()};
window.resetDemo=()=>{if(confirm('Alle lokalen Änderungen zurücksetzen?')){state=structuredClone(initialState);save();render()}};

window.pickRoomPhoto=id=>{$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{state.rooms.find(r=>r.id===id).photo=rd.result;save();openRoom(id)};rd.readAsDataURL(f)};$('#photoInput').click()};
function modal(html){$('#modalRoot').insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modalBack"><div class="modal">${html}</div></div>`)}
window.closeModal=()=>$('#modalBack')?.remove();
window.modal=modal;

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();openFromQuery();if(state.timeRunning)startTimerTick();
</script>
</body>
</html>
