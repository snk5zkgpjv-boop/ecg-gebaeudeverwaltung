const LOCAL_ONLY_KEYS=['currentUserId','currentRole','activeTab','buildingSubTab','inventorySubTab','currentRoomId','elapsedStart','timeRunning','issueListMode'];
function cloudPayload(){const x=structuredClone(state);for(const k of LOCAL_ONLY_KEYS)delete x[k];if(x.settings)x.settings={...x.settings,cloudSync:undefined};return x}
function mergeCloudState(remote){const local={};for(const k of LOCAL_ONLY_KEYS)local[k]=state[k];const localCloud=state.settings?.cloudSync;state={...state,...remote,...local};state.settings={...(state.settings||{}),...(remote.settings||{}),cloudSync:localCloud};const cu=(state.users||[]).find(u=>u.id===state.currentUserId);if(cu)state.currentRole=cu.role;else if((state.users||[]).length){state.currentUserId=state.users[0].id;state.currentRole=state.users[0].role}}
function save(){localStorage.setItem('cleaningAppState',JSON.stringify(state)); syncCloudDebounced();}
let syncTimer; function syncCloudDebounced(){clearTimeout(syncTimer);syncTimer=setTimeout(syncCloud,700)}
let authSession=null;
async function authHeaders(extra={}){return extra}
async function syncCloud(){if(!state.settings.cloudSync||!authSession) return; try{const r=await fetch('/api/state',{method:'PUT',headers:await authHeaders({'content-type':'application/json'}),body:JSON.stringify(cloudPayload())}); if(r.ok){$('.sync')?.replaceChildren(document.createTextNode('Cloud synchronisiert'))}else if(r.status===401||r.status===403){showLoginGate('Deine Anmeldung ist abgelaufen.')}else{$('.sync')?.replaceChildren(document.createTextNode('Cloud-Fehler'))}}catch{$('.sync')?.replaceChildren(document.createTextNode('Cloud nicht erreichbar'))}}
async function pullCloud(){if(!state.settings.cloudSync||!authSession)return;try{const r=await fetch('/api/state',{headers:await authHeaders()});if(r.ok){const remote=await r.json();if(remote?.version){mergeCloudState(remote);bindAuthUser();localStorage.setItem('cleaningAppState',JSON.stringify(state));render()}}else if(r.status===401||r.status===403){showLoginGate('Bitte erneut anmelden.')}}catch{}}

function due(task){if(['asneeded','afteruse','afterevent'].includes(task.interval))return false;if(!task.lastDone)return true;const d=new Date(task.lastDone), n=new Date();const days=(n-d)/86400000;return {daily:days>=1,weekly:days>=7,biweekly:days>=14,monthly:days>=30,quarterly:days>=90,semiannual:days>=182,annual:days>=365}[task.interval]||false}
function allTasks(){return state.rooms.flatMap(r=>r.tasks.map(x=>({...x,room:r})))}
function floorSortKey(floor){const s=(floor||'').toLowerCase().replace(/\s/g,'');if(s.includes('basis')||s==='ug'||s.includes('untergeschoss'))return 0;if(s==='eg'||s.includes('erdgeschoss'))return 10;const m=s.match(/(\d+)[.]?og/);if(m)return 10+Number(m[1]);if(s.includes('dg')||s.includes('dachgeschoss'))return 90;return 50}
function groupDueTasksByFloor(tasks){const groups={};tasks.forEach(x=>{const f=x.room.floor||'Ohne Geschoss';(groups[f]??=[]).push(x)});return Object.entries(groups).sort((a,b)=>floorSortKey(a[0])-floorSortKey(b[0])||a[0].localeCompare(b[0],'de')).map(([floor,items])=>[floor,items.sort((a,b)=>a.room.name.localeCompare(b.room.name,'de')||a.title.localeCompare(b.title,'de'))])}
function timeEntryLabel(e){if(e.workLabel)return e.workLabel;const r=state.rooms.find(x=>x.id===e.roomId);return r?`${r.floor} – ${r.name}`:'Allgemein / kein Raum'}

function eventRuleFor(ev){return (state.eventRules||[]).find(r=>(ev.title||'').toLowerCase().includes((r.keyword||'').toLowerCase()))}
function eventRoomsFor(rule){
 if(!rule)return[];
 const matches=[];
 for(const r of state.rooms){
   if((rule.roomMatch||[]).some(m=>(r.name+' '+r.type).toLowerCase().includes(String(m).toLowerCase())))matches.push(r)
 }
 return matches
}
function generatedEventTasks(){
 const now=Date.now(),lookback=7*86400000,out=[];
 for(const ev of (state.calendarEvents||[])){
   if(ev.cancelled||/fällt aus|abgesagt|entfällt/i.test(ev.title||''))continue;
   const end=new Date(ev.end).getTime();
   if(end>now||now-end>lookback)continue;
   const rule=eventRuleFor(ev); if(!rule)continue;
   const rooms=eventRoomsFor(rule);
   for(const r of rooms){
     for(const title of (rule.tasks||[])){
       const id=`${ev.id}__${r.id}__${title}`;
       if(state.eventTaskDone?.[id])continue;
       out.push({id,title,room:r,event:ev,rule:rule,interval:'afterevent',status:'open'})
     }
   }
 }
 return out
}
function upcomingEvents(limit=6){
 const now=Date.now();
 return (state.calendarEvents||[]).filter(e=>new Date(e.end).getTime()>=now).sort((a,b)=>new Date(a.start)-new Date(b.start)).slice(0,limit)
}
function eventDateLabel(ev){
 const d=new Date(ev.start);return {day:d.toLocaleDateString('de-DE',{day:'2-digit'}),mon:d.toLocaleDateString('de-DE',{month:'short'}),time:d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
}

function stats(){const tasks=allTasks(),evt=generatedEventTasks();return {due:tasks.filter(x=>due(x)).length+evt.length,rooms:state.rooms.length,issues:state.issues.filter(x=>x.status!=='done').length,low:state.materials.filter(m=>m.qty<m.min).length}}

function timeElapsed(){
  if(!state.timeRunning)return 0;
  return Math.max(0,Date.now()-new Date(state.timeRunning.start).getTime())
}
function fmtDuration(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60),mm=m%60;return `${h}:${String(mm).padStart(2,'0')} Std.`}

  return `<section class="hero"><h2>Gebäudeverwaltung</h2><p>Gebäude, Außenanlagen, Inventar, Material, Arbeitszeit und Mängel an einem Ort. Ohne Leistungsranglisten oder Mitarbeiterbewertung.</p></section>
  <div class="grid stats" style="margin-top:14px"><div class="stat"><b>${s.due}</b><span>Aufgaben fällig</span></div><div class="stat"><b>${s.rooms}</b><span>Räume angelegt</span></div><div class="stat clickable" onclick="showOpenIssues()"><b>${s.issues}</b><span>offene Hinweise</span><small>antippen zum Öffnen</small></div><div class="stat"><b>${s.low}</b><span>Material unter Mindestbestand</span></div></div>
  <div class="section-title"><h2>Zeiterfassung</h2></div>
  <div class="card timer-card">
    ${u?`<div class="row wrap"><div><div class="task-title">${esc(u.name)}</div><div class="meta">${esc(u.email||'lokales Profil')} · ${esc(roleLabels[u.role])}</div></div><div class="spacer"></div>${timer?`<div class="timer-time" id="liveTimer">${fmtDuration(timeElapsed())}</div>`:''}</div>
    ${timer?`<div class="notice"><b>${esc(timeEntryLabel(timer))}</b><br>Gestartet ${new Date(timer.start).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}${timer.note?` · ${esc(timer.note)}`:''}</div><button class="btn danger" onclick="stopTime()">Arbeitszeit beenden</button>`:
    `<div class="formgrid"><div class="field wide"><label>Bereich / Raum</label><select id="timeRoom"><option value="">Allgemein / kein Raum</option>${state.rooms.slice().sort((a,b)=>floorSortKey(a.floor)-floorSortKey(b.floor)||a.name.localeCompare(b.name,'de')).map(r=>`<option value="${r.id}">${esc(r.floor)} – ${esc(r.name)}</option>`).join('')}</select></div><div class="field wide"><label>Tätigkeit / Bemerkung (optional)</label><input id="timeNote" placeholder="z. B. Grundreinigung, Auffüllen, Reparatur…"></div></div><button class="btn primary" onclick="startTime()">Arbeitszeit starten</button>`}`:
    `<div class="notice">Für die Zeiterfassung zuerst einen Benutzer auswählen.</div>`}
    ${recent.length?`<div><div class="meta" style="margin-bottom:6px">Letzte Einträge</div>${recent.map(e=>{const eu=state.users.find(x=>x.id===e.userId);return `<div class="task"><div></div><div><div class="task-title">${esc(timeEntryLabel(e))}</div><small>${esc(eu?.name||'Benutzer')} · ${new Date(e.start).toLocaleString('de-DE')} · ${fmtDuration(new Date(e.end)-new Date(e.start))}${e.note?` · ${esc(e.note)}`:''}</small></div></div>`}).join('')}</div>`:''}
  </div>
  <div class="section-title"><h2>Heute fällig</h2></div>${dueGroups.length?dueGroups.map(([floor,items])=>`<div class="card" style="margin-bottom:12px"><div class="row" style="padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px"><h3 style="margin:0">${esc(floor)}</h3><div class="spacer"></div><span class="pill warn">${items.length} fällig</span></div>${items.map(x=>taskRow(x.room,x)).join('')}</div>`).join(''):'<div class="card"><div class="empty">Aktuell nichts fällig.</div></div>'}
  ${can('manageCalendar')?`<div class="section-title"><h2>Kommende Veranstaltungen</h2><div class="spacer"></div><button class="btn tiny" onclick="go('calendar')">Kalender öffnen</button></div>
  <div class="card calendar-card">${upcoming.length?upcoming.map(ev=>{const d=eventDateLabel(ev),rule=eventRuleFor(ev);return `<div class="event-row"><div class="event-date">${d.day}<span>${d.mon}</span></div><div><div class="event-title">${esc(ev.title)}</div><div class="event-meta">${d.time}${ev.location?` · ${esc(ev.location)}`:''}</div></div><span class="pill ${ev.cancelled?'warn':rule?'ok':''}">${ev.cancelled?'fällt aus':rule?'Aufgabenregel':'Kalender'}</span></div>`}).join(''):'<div class="empty">Keine kommenden Veranstaltungen.</div>'}</div>`:''}
  ${can('viewMaintenance')?`<div class="section-title"><h2>Technik & Wartung</h2><div class="spacer"></div><button class="btn tiny" onclick="showMaintenance()">Öffnen</button></div><div class="card"><div class="row"><div><b>${(state.maintenanceAssets||[]).filter(m=>['overdue','due'].includes(maintenanceStatus(m).key)).length}</b><div class="meta">Wartungen fällig / bald fällig</div></div><div class="spacer"></div><span class="pill">🔧</span></div></div>`:''}<div class="section-title"><h2>Schnellzugriff</h2></div><div class="grid room-list">${can('manageCalendar')?`<div class="card room" onclick="go('calendar')"><h3>Kalender & Veranstaltungen</h3><div class="meta">Google-Kalender und Folgeaufgaben</div></div>`:''}${state.rooms.slice(0,3).map(roomCard).join('')}</div>`
}
window.startTime=()=>{const u=currentUser();if(!u){alert('Bitte zuerst Benutzer auswählen.');return}const roomId=$('#timeRoom')?.value||'',r=state.rooms.find(x=>x.id===roomId),note=$('#timeNote')?.value.trim()||'';state.timeRunning={id:uid('time'),userId:u.id,start:nowISO(),roomId,workLabel:r?`${r.floor} – ${r.name}`:'Allgemein / kein Raum',note};save();render();startTimerTick()};
window.stopTime=()=>{if(!state.timeRunning)return;const e={...state.timeRunning,end:nowISO()};state.timeEntries.unshift(e);state.timeRunning=null;save();render()};
let timerInterval=null;function startTimerTick(){clearInterval(timerInterval);timerInterval=setInterval(()=>{const el=$('#liveTimer');if(el&&state.timeRunning)el.textContent=fmtDuration(timeElapsed())},15000)}

function taskRow(r,t){
 if(t.event)return `<div class="task"><button class="check" onclick="completeEventTask('${t.id}')"></button><div><div class="task-title">${esc(t.title)}</div><small>${esc(r.name)} · ${esc(r.floor)}</small><div class="event-task-source">Nach Veranstaltung: ${esc(t.event.title)} · ${new Date(t.event.end).toLocaleDateString('de-DE')}</div></div><button class="btn tiny" onclick="completeEventTask('${t.id}')">erledigt</button></div>`;
 const admin=can('manageTasks');
 return `<div class="task"><button class="check ${t.status==='done'?'done':''}" onclick="toggleTask('${r.id}','${t.id}')">${t.status==='done'?'✓':''}</button><div><div class="task-title">${esc(t.title)}</div><small>${esc(r.name)} · ${esc(r.floor)} · ${intervals[t.interval]||t.interval}${t.lastDone?` · zuletzt ${new Date(t.lastDone).toLocaleDateString('de-DE')}`:''}</small>${admin&&state.currentRoomId===r.id?`<div class="task-admin-actions"><button class="btn tiny" onclick="editTask('${r.id}','${t.id}')">Bearbeiten</button><button class="btn tiny danger" onclick="deleteTask('${r.id}','${t.id}')">Löschen</button></div>`:''}</div><select class="btn tiny" onchange="setTaskStatus('${r.id}','${t.id}',this.value)"><option value="open" ${t.status==='open'?'selected':''}>offen</option><option value="done" ${t.status==='done'?'selected':''}>erledigt</option><option value="na" ${t.status==='na'?'selected':''}>nicht nötig</option><option value="material" ${t.status==='material'?'selected':''}>Material fehlt</option><option value="note" ${t.status==='note'?'selected':''}>Hinweis</option></select></div>`
}
window.completeEventTask=id=>{state.eventTaskDone[id]={doneAt:nowISO(),userId:state.currentUserId||null};save();render()};
window.toggleTask=(rid,tid)=>{const t=state.rooms.find(r=>r.id===rid).tasks.find(t=>t.id===tid);t.status=t.status==='done'?'open':'done';if(t.status==='done'){t.lastDone=nowISO();t.lastDoneBy=state.currentUserId||null}save();render()};
window.setTaskStatus=(rid,tid,v)=>{const t=state.rooms.find(r=>r.id===rid).tasks.find(t=>t.id===tid);t.status=v;if(v==='done')t.lastDone=nowISO();save();render()};

window.showTemplates=()=>modal(`<h2>Raumvorlagen</h2><div class="grid">${state.templates.map(x=>`<div class="card template-card"><div class="row"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.type)} · ${x.tasks.length} Aufgaben</div></div><div class="spacer"></div><button class="btn primary tiny" onclick="createFromTemplate('${x.id}')">Raum daraus anlegen</button></div></div>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Schließen</button></div>`);

function qrUrl(r){const payload=encodeURIComponent(`${location.origin}${location.pathname}?room=${r.qrId}`);return `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${payload}`}

window.showAllRoomQRs=()=>{

   const order={'Basisgeschoss':0,'UG':1,'EG':2,'1. OG':3,'2. OG':4,'3. OG':5,'DG':9,'Außen':10};
   return (order[a.floor]??6)-(order[b.floor]??6)||a.name.localeCompare(b.name,'de');
 });
 modal(`<div class="row print-hide"><div><h2>QR-Codes – Räume</h2><div class="meta">${rooms.length} Raum-QR-Codes</div></div><div class="spacer"></div><button class="btn primary" onclick="printRoomQRSheet()">Drucken / als PDF sichern</button><button class="btn" onclick="exportRoomQRList()">Liste exportieren</button></div>
 <div class="qr-sheet">${rooms.map(r=>`<div class="qr-label"><img src="${qrUrl(r)}" alt="QR ${esc(r.name)}"><b>${esc(r.name)}</b><small>${esc(r.floor)} · ${esc(r.type)}</small><small>Raum-ID: ${esc(r.qrId)}</small></div>`).join('')}</div>
 <div class="row print-hide" style="margin-top:14px"><button class="btn" onclick="closeModal()">Schließen</button></div>`)
};

 window.print();
 setTimeout(()=>document.body.classList.remove('qr-print-mode'),1000);
};
window.exportRoomQRList=()=>{
 const rows=[['Geschoss','Raum','Raumtyp','Raum-ID','QR-Link'],...state.rooms.map(r=>[r.floor,r.name,r.type,r.qrId,`${location.origin}${location.pathname}?room=${encodeURIComponent(r.qrId)}`])];
 const csv=rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');

};

function addIssue(rid, outdoorId='', assetId=''){pendingPhoto=null;modal(`<h2>Hinweis / Mangel melden</h2><div class="formgrid"><div class="field"><label>Raum</label><select id="isRoom"><option value="">Allgemein</option>${state.rooms.map(x=>`<option value="${x.id}" ${rid===x.id?'selected':''}>${esc(x.floor)} – ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Außenbereich</label><select id="isOutdoor"><option value="">–</option>${state.outdoorAreas.map(x=>`<option value="${x.id}" ${outdoorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Inventar</label><select id="isAsset"><option value="">–</option>${(state.inventory||[]).map(x=>`<option value="${x.id}" ${assetId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Priorität</label><select id="isPri"><option>normal</option><option>hoch</option><option>dringend</option></select></div><div class="field wide"><label>Beschreibung</label><textarea id="isText" rows="4"></textarea></div><div class="field wide"><label>Foto</label><button class="btn" onclick="captureIssuePhoto()">Foto aufnehmen/auswählen</button><div id="photoPreview"></div></div></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveIssue()">Melden</button><button class="btn" onclick="pendingPhoto=null;closeModal()">Abbrechen</button></div>`)}
window.addIssue=addIssue; let pendingPhoto=null;
window.captureIssuePhoto=()=>{$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{try{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingPhoto=c.toDataURL('image/jpeg',.78);$('#photoPreview').innerHTML=`<img class="photo" src="${pendingPhoto}">`}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);alert('Das Foto konnte nicht verarbeitet werden. Bitte ein anderes Foto auswählen.')};img.src=url};$('#photoInput').value='';$('#photoInput').click()};
window.saveIssue=()=>{const issue={id:uid('issue'),roomId:$('#isRoom')?.value||'',outdoorId:$('#isOutdoor')?.value||'',assetId:$('#isAsset')?.value||'',priority:$('#isPri')?.value||'normal',text:$('#isText')?.value.trim()||'',status:'open',created:nowISO(),photo:pendingPhoto};if(!issue.text){alert('Bitte eine kurze Beschreibung eingeben.');return}state.issues=state.issues||[];state.issues.unshift(issue);try{save()}catch(err){state.issues.shift();console.error(err);alert('Der Mangel konnte nicht gespeichert werden. Bitte die Seite neu laden und erneut versuchen. Falls ein Foto verwendet wurde, bitte ohne Foto testen.');return}pendingPhoto=null;closeModal();state.activeTab='issues';render()};

function issueLocation(i){
 const r=state.rooms.find(x=>x.id===i.roomId),o=state.outdoorAreas.find(x=>x.id===i.outdoorId),a=state.inventory.find(x=>x.id===i.assetId);
 return r?`${r.floor} – ${r.name}`:o?o.name:a?`Inventar – ${a.name}`:'Allgemein'
}
window.openIssue=id=>{const i=state.issues.find(x=>x.id===id);if(!i)return;modal(`<div class="row"><div><h2>Mangel / Hinweis</h2><div class="meta">${esc(issueLocation(i))} · gemeldet ${new Date(i.created).toLocaleString('de-DE')}${i.status==='done'&&i.completedAt?` · erledigt ${new Date(i.completedAt).toLocaleDateString('de-DE')}`:''}</div></div><div class="spacer"></div><span class="pill ${i.priority==='dringend'?'danger':i.priority==='hoch'?'warn':''}">${esc(i.priority)}</span></div><div class="card" style="box-shadow:none;margin-top:12px"><p>${esc(i.text||'Keine Beschreibung')}</p>${i.photo?`<img class="photo" src="${i.photo}">`:''}</div><div class="field" style="margin-top:12px"><label>Status</label><select id="issueQuickStatus" onchange="setIssueAndStay('${i.id}',this.value)"><option value="open" ${i.status==='open'?'selected':''}>offen</option><option value="work" ${i.status==='work'?'selected':''}>in Arbeit</option><option value="done" ${i.status==='done'?'selected':''}>erledigt</option></select></div><div class="row wrap" style="margin-top:14px"><button class="btn primary" onclick="closeModal();editIssue('${i.id}')">Bearbeiten</button><button class="btn ${i.status==='done'?'':'soft'}" onclick="markIssueDone('${i.id}')">${i.status==='done'?'Erledigt ✓':'Als erledigt markieren'}</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)};
window.editIssue=id=>{const i=state.issues.find(x=>x.id===id);pendingPhoto=i.photo||null;modal(`<h2>Mangel bearbeiten</h2><div class="formgrid"><div class="field"><label>Raum</label><select id="eiRoom"><option value="">Allgemein</option>${state.rooms.map(x=>`<option value="${x.id}" ${i.roomId===x.id?'selected':''}>${esc(x.floor)} – ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Außenbereich</label><select id="eiOutdoor"><option value="">–</option>${state.outdoorAreas.map(x=>`<option value="${x.id}" ${i.outdoorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Inventar</label><select id="eiAsset"><option value="">–</option>${state.inventory.map(x=>`<option value="${x.id}" ${i.assetId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Priorität</label><select id="eiPri">${['normal','hoch','dringend'].map(x=>`<option ${i.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="eiStatus"><option value="open" ${i.status==='open'?'selected':''}>offen</option><option value="work" ${i.status==='work'?'selected':''}>in Arbeit</option><option value="done" ${i.status==='done'?'selected':''}>erledigt</option></select></div><div class="field wide"><label>Beschreibung</label><textarea id="eiText" rows="5">${esc(i.text||'')}</textarea></div><div class="field wide"><label>Foto</label><button class="btn" onclick="captureIssuePhoto()">Foto ändern</button><div id="photoPreview">${i.photo?`<img class="photo" src="${i.photo}">`:''}</div></div></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveIssueEdit('${i.id}')">Speichern</button><button class="btn" onclick="closeModal();openIssue('${i.id}')">Abbrechen</button></div>`)};
function issueCompletedAt(i){return i.completedAt?new Date(i.completedAt):null}
function issueArchiveDate(i){const d=issueCompletedAt(i);return d?new Date(d.getTime()+7*24*60*60*1000):null}
function isIssueArchived(i){const d=issueArchiveDate(i);return i.status==='done'&&d&&Date.now()>=d.getTime()}
function setIssueStatusValue(i,v){if(!i)return;if(v==='done'){if(i.status!=='done'||!i.completedAt)i.completedAt=nowISO()}else{i.completedAt=null}i.status=v}
window.saveIssueEdit=id=>{const i=state.issues.find(x=>x.id===id);const newStatus=$('#eiStatus').value;Object.assign(i,{roomId:$('#eiRoom').value,outdoorId:$('#eiOutdoor').value,assetId:$('#eiAsset').value,priority:$('#eiPri').value,text:$('#eiText').value.trim(),photo:pendingPhoto});setIssueStatusValue(i,newStatus);pendingPhoto=null;save();closeModal();openIssue(id)};
window.setIssue=(id,v)=>{const i=state.issues.find(x=>x.id===id);setIssueStatusValue(i,v);save();render()};
window.setIssueAndStay=(id,v)=>{const i=state.issues.find(x=>x.id===id);setIssueStatusValue(i,v);save();closeModal();openIssue(id)};
window.markIssueDone=id=>{const i=state.issues.find(x=>x.id===id);setIssueStatusValue(i,'done');save();closeModal();openIssue(id)};
window.showOpenIssues=()=>{const open=state.issues.filter(i=>i.status!=='done');if(open.length===1){openIssue(open[0].id);return}state.activeTab='issues';state.issueListMode='active';save();render()};
window.setIssueListMode=mode=>{state.issueListMode=mode;try{save()}catch(e){console.warn(e)}render()};

function issueCard(i){

 return `<div class="issue" onclick="openIssue('${i.id}')"><div class="row"><span class="pill ${i.priority==='dringend'?'danger':i.priority==='hoch'?'warn':''}">${esc(i.priority)}</span><b>${esc(issueLocation(i))}</b><div class="spacer"></div><select class="btn tiny" onclick="event.stopPropagation()" onchange="setIssue('${i.id}',this.value)"><option value="open" ${i.status==='open'?'selected':''}>offen</option><option value="work" ${i.status==='work'?'selected':''}>in Arbeit</option><option value="done" ${i.status==='done'?'selected':''}>erledigt</option></select></div><div style="margin-top:7px">${esc(i.text)}</div>${i.photo?`<img class="photo" src="${i.photo}">`:''}${timing}<div class="row" style="margin-top:8px"><div class="meta">Gemeldet: ${new Date(i.created).toLocaleString('de-DE')}</div><div class="spacer"></div><button class="btn tiny" onclick="event.stopPropagation();editIssue('${i.id}')">Bearbeiten</button></div></div>`
}
function issuesView(){
 const mode=state.issueListMode||'active';
 const active=(state.issues||[]).filter(i=>!isIssueArchived(i)).sort((a,b)=>(a.status==='done')-(b.status==='done')||new Date(b.created)-new Date(a.created));
 const archived=(state.issues||[]).filter(isIssueArchived).sort((a,b)=>new Date(b.completedAt||b.created)-new Date(a.completedAt||a.created));
 const items=mode==='archive'?archived:active;
 return `<div class="section-title"><h2>Hinweise & Mängel</h2><div class="spacer"></div><button class="btn primary" onclick="addIssue()">+ Hinweis</button></div>

 ${mode==='active'?`<div class="notice" style="margin-bottom:12px">Erledigte Mängel bleiben noch 7 Tage in dieser Ansicht und werden danach automatisch ins Archiv verschoben.</div>`:''}
 <div class="card">${items.length?items.map(issueCard).join(''):`<div class="empty">${mode==='archive'?'Noch keine archivierten Mängel.':'Keine aktuellen Hinweise oder Mängel.'}</div>`}</div>`
}

 const admin=can('manageInventory');
 return `<div class="section-title"><h2>Inventar</h2><div class="spacer"></div>${admin?'<button class="btn primary" onclick="editAsset()">+ Inventar</button><button class="btn" onclick="showLoans()">Ausleihe</button>':''}</div>
 <div class="toolbar"><input id="assetSearch" placeholder="Inventar suchen…" oninput="filterAssets()"><select id="assetLocation" onchange="filterAssets()"><option value="">Alle Lagerorte</option>${state.storageLocations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select><button class="btn" onclick="scanAssetQR()">QR öffnen</button>${admin?'<button class="btn" onclick="printAllAssetQR()">Alle QR drucken / PDF</button>':''}</div>
 <div id="assetGrid" class="inventory-grid">${state.inventory.length?state.inventory.map(assetCard).join(''):'<div class="card empty">Noch kein Inventar erfasst. Über „+ Inventar“ können Werkzeuge, Geräte, Maschinen und sonstige Gegenstände mit eigenem QR-Code angelegt werden.</div>'}</div>`
}
function assetCard(a){
 const loc=state.storageLocations.find(l=>l.id===a.locationId),room=state.rooms.find(r=>r.id===a.roomId),admin=can('manageInventory');
 const where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');
 return `<div class="card" data-asset="${esc((a.name+' '+(a.category||'')+' '+where).toLowerCase())}" data-location="${esc(a.locationId||'')}">
   <div class="asset-photo">${a.photo?`<img src="${a.photo}">`:'◇'}</div>
   <div class="row" style="margin-top:10px"><div><b>${esc(a.name)}</b><div class="meta">${esc(a.category||'Inventar')} · ${esc(where)}</div></div><div class="spacer"></div><span class="pill">${esc(a.condition||'in Ordnung')}</span></div>
   <div style="margin-top:8px"><span class="asset-code">${esc(a.assetId)}</span> ${a.loanable?`<span class="pill ${a.loanStatus==='loaned'?'warn':'ok'}">${a.loanStatus==='loaned'?`ausgeliehen · ${esc(a.loanedTo||'')}`:'ausleihbar'}</span>`:''}</div>
   <div class="asset-actions">
     <button class="btn tiny" onclick="openAsset('${a.id}')">Öffnen</button>
     <button class="btn tiny" onclick="showAssetQR('${a.id}')">QR-Code</button>
     ${admin?`<button class="btn tiny" onclick="editAsset('${a.id}')">Bearbeiten</button>`:''}
   </div>
 </div>`
}
window.filterAssets=()=>{const q=($('#assetSearch').value||'').toLowerCase(),loc=$('#assetLocation').value;document.querySelectorAll('[data-asset]').forEach(el=>el.style.display=(!q||el.dataset.asset.includes(q))&&(!loc||el.dataset.location===loc)?'':'none')};
window.editAsset=id=>{
 if(!can('manageInventory')){alert('Inventarverwaltung ist für dieses Konto nicht freigeschaltet.');return}
 const a=id?state.inventory.find(x=>x.id===id):{name:'',category:'Werkzeug',locationId:'',roomId:'',manufacturer:'',model:'',serial:'',condition:'in Ordnung',purchaseDate:'',nextMaintenance:'',notes:'',photo:'',loanable:false,loanStatus:'available'};
 modal(`<h2>${id?'Inventar bearbeiten':'Inventar anlegen'}</h2>
 <div class="formgrid">
   <div class="field"><label>Bezeichnung</label><input id="asName" value="${esc(a.name)}"></div>
   <div class="field"><label>Kategorie</label><input id="asCat" value="${esc(a.category)}" placeholder="Werkzeug, Maschine, Gerät…"></div>
   <div class="field wide"><label>Raum zuordnen</label><select id="asRoom" onchange="assetRoomChanged()"><option value="">Kein Raum</option>${state.rooms.map(r=>`<option value="${r.id}" ${a.roomId===r.id?'selected':''}>${esc(r.floor)} – ${esc(r.name)}</option>`).join('')}</select><div class="asset-room-note">Hier kannst du direkt einen bereits hinterlegten Raum auswählen.</div></div>
   <div class="field wide"><label>Alternativer Lagerort</label><select id="asLoc" onchange="assetLocationChanged()"><option value="">Kein separater Lagerort</option>${state.storageLocations.map(l=>`<option value="${l.id}" ${a.locationId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select><div class="asset-room-note">Für Garagen, Lager oder sonstige Orte außerhalb der Raumliste.</div></div>
   <div class="field"><label>Hersteller</label><input id="asMan" value="${esc(a.manufacturer||'')}"></div>
   <div class="field"><label>Modell</label><input id="asModel" value="${esc(a.model||'')}"></div>
   <div class="field"><label>Seriennummer</label><input id="asSerial" value="${esc(a.serial||'')}"></div>
   <div class="field"><label>Ausleihbar</label><select id="asLoanable"><option value="no" ${a.loanable?'':'selected'}>Nein</option><option value="yes" ${a.loanable?'selected':''}>Ja</option></select></div>
   <div class="field"><label>Zustand</label><select id="asCond">${['in Ordnung','Wartung fällig','defekt','außer Betrieb'].map(x=>`<option ${a.condition===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="field"><label>Kaufdatum</label><input id="asBuy" type="date" value="${esc(a.purchaseDate||'')}"></div>
   <div class="field"><label>Nächste Wartung/Prüfung</label><input id="asMaint" type="date" value="${esc(a.nextMaintenance||'')}"></div>
   <div class="field wide"><label>Notizen</label><textarea id="asNotes">${esc(a.notes||'')}</textarea></div>
   <div class="field wide"><label>Foto</label><button class="btn" onclick="captureAssetPhoto()">Foto aufnehmen/auswählen</button><div id="assetPhotoPreview">${a.photo?`<img class="photo" src="${a.photo}">`:''}</div></div>
   ${can('useAI')?'<div class="field wide"><button class="btn soft" onclick="analyzeInventoryPhoto()">✨ Foto mit KI auswerten</button><div class="meta">Erkannte Angaben werden in das Formular eingetragen. Speichern musst du anschließend selbst.</div></div>':''}
   ${id?`<div class="field wide"><label>QR-Code</label><div class="row wrap"><span class="asset-code">${esc(a.assetId)}</span><button class="btn" onclick="closeModal();showAssetQR('${a.id}')">QR öffnen / drucken / exportieren</button></div></div>`:`<div class="field wide"><label>QR-Code</label><div class="notice">Beim Speichern wird automatisch eine dauerhafte Inventar-ID und der dazugehörige QR-Code erzeugt.</div></div>`}
 </div>
 <div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveAsset('${id||''}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`);
 pendingAssetPhoto=a.photo||''
};
window.assetRoomChanged=()=>{if($('#asRoom').value)$('#asLoc').value=''};
window.assetLocationChanged=()=>{if($('#asLoc').value)$('#asRoom').value=''};
let pendingAssetPhoto='';
window.captureAssetPhoto=()=>{$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{try{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingAssetPhoto=c.toDataURL('image/jpeg',.78);$('#assetPhotoPreview').innerHTML=`<img class="photo" src="${pendingAssetPhoto}">`}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);alert('Das Foto konnte nicht verarbeitet werden.')};img.src=url};$('#photoInput').value='';$('#photoInput').click()};
function selectAiImage(){return new Promise(resolve=>{$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return resolve(null);const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{const scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>resolve(null);img.src=url};$('#photoInput').value='';$('#photoInput').click()})}
async function aiAnalyze(task){if(!can('useAI'))throw new Error('KI-Funktion ist nicht freigeschaltet.');const image=await selectAiImage();if(!image)throw new Error('Kein Bild ausgewählt.');const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task,image})}),b=await r.json();if(!r.ok)throw new Error(b.error||'KI-Auswertung fehlgeschlagen.');return{data:b.result,image}}
window.analyzeRoomPhoto=async()=>{try{const{data}=await aiAnalyze('room_plan');if(data.name)$('#erName').value=data.name;if(data.type)$('#erType').value=data.type;if(data.notes)$('#erNotes').value=data.notes;if(data.floor&&[...$('#erFloor').options].some(x=>x.value===data.floor))$('#erFloor').value=data.floor;pendingRoomAiTasks=data.tasks||[];alert(`${pendingRoomAiTasks.length} Aufgabenvorschläge wurden vorbereitet. Bitte Angaben prüfen und „Raumdaten speichern“ wählen.`)}catch(e){alert(e.message)}};
window.analyzeInventoryPhoto=async()=>{try{const{data,image}=await aiAnalyze('inventory');$('#asName').value=data.name||'';$('#asCat').value=data.category||'';$('#asMan').value=data.manufacturer||'';$('#asModel').value=data.model||'';$('#asSerial').value=data.serialNumber||'';$('#asNotes').value=data.notes||'';pendingAssetPhoto=image;$('#assetPhotoPreview').innerHTML=`<img class="photo" src="${image}">`;alert('KI-Vorschläge wurden eingetragen. Bitte prüfen und anschließend speichern.')}catch(e){alert(e.message)}};
window.saveAsset=id=>{
 const roomId=$('#asRoom')?.value||'',locationId=$('#asLoc')?.value||'';
 const data={name:$('#asName')?.value.trim()||'Inventar',category:$('#asCat')?.value.trim()||'Inventar',roomId,locationId,manufacturer:$('#asMan')?.value.trim()||'',model:$('#asModel')?.value.trim()||'',serial:$('#asSerial')?.value.trim()||'',condition:$('#asCond')?.value||'in Ordnung',purchaseDate:$('#asBuy')?.value||'',nextMaintenance:$('#asMaint')?.value||'',notes:$('#asNotes')?.value.trim()||'',photo:pendingAssetPhoto||'',loanable:$('#asLoanable')?.value==='yes',loanStatus:id?(state.inventory.find(x=>x.id===id)?.loanStatus||'available'):'available'};
 state.inventory=state.inventory||[];
 let asset, old=null;
 if(id){asset=state.inventory.find(x=>x.id===id);if(!asset){alert('Inventargegenstand wurde nicht gefunden.');return}old={...asset};Object.assign(asset,data)}
 else{asset={id:uid('asset'),assetId:uid('ECG'),...data,history:[]};state.inventory.push(asset)}
 try{save()}catch(err){
   console.error('Inventar speichern fehlgeschlagen',err);
   if(id)Object.assign(asset,old);else state.inventory=state.inventory.filter(x=>x.id!==asset.id);
   alert('Inventar konnte nicht gespeichert werden. Bitte die Seite einmal neu laden und erneut versuchen. Falls ein Foto verwendet wurde, wird es in der neuen Version automatisch verkleinert.');
   return;
 }
 pendingAssetPhoto='';closeModal();
 if(!id && confirm('Inventar wurde angelegt. QR-Code jetzt öffnen?'))showAssetQR(asset.id);else render()
};
window.openAsset=id=>{
 const a=state.inventory.find(x=>x.id===id),loc=state.storageLocations.find(l=>l.id===a.locationId),room=state.rooms.find(r=>r.id===a.roomId);
 const where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');
 modal(`<div class="row"><div><h2>${esc(a.name)}</h2><div class="meta">${esc(a.category||'')} · ${esc(where)}</div></div><div class="spacer"></div>${can('manageInventory')?`<button class="btn tiny" onclick="closeModal();editAsset('${a.id}')">Bearbeiten</button>`:''}</div>
 ${a.photo?`<img class="photo" src="${a.photo}">`:''}
 <div class="card" style="box-shadow:none;margin-top:12px"><div class="meta">Inventar-ID</div><b class="asset-code">${esc(a.assetId)}</b><p><b>Zuordnung:</b> ${esc(where)}</p><p><b>Zustand:</b> ${esc(a.condition||'')}</p>${a.manufacturer||a.model?`<p><b>Gerät:</b> ${esc([a.manufacturer,a.model].filter(Boolean).join(' '))}</p>`:''}${a.serial?`<p><b>Seriennummer:</b> ${esc(a.serial)}</p>`:''}${a.nextMaintenance?`<p><b>Nächste Wartung/Prüfung:</b> ${esc(a.nextMaintenance)}</p>`:''}${a.notes?`<p>${esc(a.notes)}</p>`:''}</div>
 <div class="row wrap" style="margin-top:12px"><button class="btn" onclick="showAssetQR('${a.id}')">QR-Code</button><button class="btn danger" onclick="closeModal();addIssue('', '', '${a.id}')">Mangel melden</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)
};
function assetQrUrl(a){const payload=encodeURIComponent(`${location.origin}${location.pathname}?asset=${a.assetId}`);return `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${payload}`}
window.showAssetQR=id=>{
 const a=state.inventory.find(x=>x.id===id),room=state.rooms.find(r=>r.id===a.roomId),loc=state.storageLocations.find(l=>l.id===a.locationId),where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');
 modal(`<h2>QR-Code – ${esc(a.name)}</h2>
 <div class="qrbox"><img id="assetQrImage" src="${assetQrUrl(a)}"><div style="margin-top:10px"><b>${esc(a.name)}</b></div><div class="meta">${esc(where)}</div><div class="meta">Dauerhafte Inventar-ID: ${esc(a.assetId)}</div></div>
 <p class="meta">Der QR-Code bleibt gültig, auch wenn Bezeichnung, Raum oder Lagerort später geändert werden.</p>
 <div class="qr-actions no-print">
   <button class="btn primary" onclick="printAssetQR()">Direkt drucken</button>
   <button class="btn" onclick="downloadAssetQR('${a.id}')">QR als Bild exportieren</button>
   <button class="btn" onclick="printAssetQR()">Als PDF speichern</button>
   <button class="btn" onclick="closeModal()">Schließen</button>
 </div>
 <p class="meta no-print">„Als PDF speichern“ öffnet den Druckdialog. Dort kannst du auf iPhone, iPad, Mac oder PC „Als PDF sichern“ wählen.</p>`)
};
window.printAssetQR=()=>window.print();
window.downloadAssetQR=id=>{
 const a=state.inventory.find(x=>x.id===id),url=assetQrUrl(a);
 const link=document.createElement('a');link.href=url;link.download=`QR-${a.assetId}-${(a.name||'Inventar').replace(/[^a-z0-9_-]+/gi,'_')}.png`;link.target='_blank';document.body.appendChild(link);link.click();link.remove()
};
window.scanAssetQR=()=>{const code=prompt('Inventar-ID oder vollständigen QR-Code eingeben:');if(!code)return;const a=state.inventory.find(a=>code.includes(a.assetId)||a.assetId===code);if(a)openAsset(a.id);else alert('Kein passendes Inventar gefunden.')};

window.printAllAssetQR=()=>{
 if(!state.inventory.length){alert('Noch kein Inventar vorhanden.');return}
 modal(`<h2>Inventar-QR-Codes</h2><div class="meta no-print">Alle Inventar-QR-Codes als Etikettenbogen. Über Drucken kann der Bogen auch als PDF gespeichert werden.</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:14px">${state.inventory.map(a=>{const room=state.rooms.find(r=>r.id===a.roomId),loc=state.storageLocations.find(l=>l.id===a.locationId),where=room?`${room.floor} – ${room.name}`:(loc?.name||'ohne Zuordnung');return `<div style="border:1px solid #ddd;padding:12px;text-align:center;border-radius:10px;break-inside:avoid"><img src="${assetQrUrl(a)}" style="width:135px;height:135px"><div><b>${esc(a.name)}</b></div><div class="meta">${esc(where)}</div><div class="meta">${esc(a.assetId)}</div></div>`}).join('')}</div>
 <div class="row no-print" style="margin-top:14px"><button class="btn primary" onclick="window.print()">Drucken / als PDF</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)
};

function materialLocationName(m){
 const loc=state.storageLocations.find(l=>l.id===m.locationId);
 return loc?.name || m.location || 'ohne Zuordnung';
}
function locationContents(l){
 const assets=state.inventory.filter(a=>a.locationId===l.id);
 const mats=state.materials.filter(m=>m.locationId===l.id || (!m.locationId && m.location===l.name));
 return {assets,mats};
}
function locationQrUrl(l){const payload=encodeURIComponent(`${location.origin}${location.pathname}?location=${l.id}`);return `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${payload}`}
window.openLocation=id=>{const l=state.storageLocations.find(x=>x.id===id);if(!l)return;const c=locationContents(l);modal(`<h2>${esc(l.name)}</h2><div class="meta">${esc(l.owner||'Gemeinde')} · Dauerhafte Lagerort-ID: ${esc(l.id)}</div>${l.notes?`<div class="notice" style="margin-top:12px">${esc(l.notes)}</div>`:''}<div class="section-title"><h2>Inhalt</h2></div><div class="card"><b>Inventar</b><div style="margin-top:6px">${c.assets.length?c.assets.map(a=>`<div class="task"><div><div class="task-title">${esc(a.name)}</div><small>${esc(a.category||'Inventar')}</small></div></div>`).join(''):'<div class="empty">Kein Inventar zugeordnet.</div>'}</div><div style="height:12px"></div><b>Verbrauchsmaterial</b><div style="margin-top:6px">${c.mats.length?c.mats.map(m=>`<div class="task"><div><div class="task-title">${esc(m.name)}</div><small>${m.qty} ${esc(m.unit)}${m.notes?` · ${esc(m.notes)}`:''}</small></div></div>`).join(''):'<div class="empty">Kein Verbrauchsmaterial zugeordnet.</div>'}</div></div><div class="row wrap" style="margin-top:14px"><button class="btn" onclick="closeModal();showLocationQR('${l.id}')">QR-Code</button>${can('manageInventory')?`<button class="btn primary" onclick="closeModal();editLocation('${l.id}')">Bearbeiten</button>`:''}<button class="btn" onclick="closeModal()">Schließen</button></div>`)};
window.showLocationQR=id=>{const l=state.storageLocations.find(x=>x.id===id);if(!l)return;modal(`<h2>QR-Code – ${esc(l.name)}</h2><div class="qrbox"><img src="${locationQrUrl(l)}" alt="QR-Code"><div style="margin-top:10px"><b>${esc(l.name)}</b></div><div class="meta">Dauerhafte Lagerort-ID: ${esc(l.id)}</div></div><p class="meta">Der QR-Code bleibt gültig, auch wenn der Lagerort später umbenannt wird.</p><div class="row wrap"><button class="btn primary" onclick="window.print()">Drucken / als PDF</button><button class="btn" onclick="downloadLocationQR('${l.id}')">QR als Bild exportieren</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)};
window.downloadLocationQR=id=>{const l=state.storageLocations.find(x=>x.id===id);if(!l)return;const link=document.createElement('a');link.href=locationQrUrl(l);link.download=`QR-Lagerort-${(l.name||'Lagerort').replace(/[^a-z0-9_-]+/gi,'_')}.png`;link.target='_blank';document.body.appendChild(link);link.click();link.remove()};
window.showAllLocationQRs=()=>{const locs=[...(state.storageLocations||[])].sort((a,b)=>a.name.localeCompare(b.name,'de'));modal(`<div class="row print-hide"><div><h2>QR-Codes – Lagerorte</h2><div class="meta">${locs.length} Lagerort-QR-Codes</div></div><div class="spacer"></div><button class="btn primary" onclick="window.print()">Drucken / als PDF sichern</button></div><div class="qr-sheet">${locs.map(l=>`<div class="qr-label"><img src="${locationQrUrl(l)}" alt="QR ${esc(l.name)}"><b>${esc(l.name)}</b><small>${esc(l.owner||'Gemeinde')}</small><small>Lagerort-ID: ${esc(l.id)}</small></div>`).join('')}</div><div class="row print-hide" style="margin-top:14px"><button class="btn" onclick="closeModal()">Schließen</button></div>`)};
function locationsView(){return `<div class="section-title"><h2>Lagerorte</h2><div class="spacer"></div><div class="row wrap"><button class="btn" onclick="showAllLocationQRs()">QR-Codes drucken / PDF</button>${can('manageInventory')?'<button class="btn primary" onclick="editLocation()">+ Lagerort</button>':''}</div></div><div class="card">${state.storageLocations.map(l=>{const c=locationContents(l);return `<div class="user-row"><div onclick="openLocation('${l.id}')" style="cursor:pointer;flex:1"><b>${esc(l.name)}</b><div class="meta">${esc(l.owner||'Gemeinde')} · ${c.assets.length} Inventargegenstände · ${c.mats.length} Verbrauchsartikel</div>${l.notes?`<div class="meta" style="margin-top:4px">${esc(l.notes)}</div>`:''}<div style="margin-top:8px">${c.assets.length?`<div><b style="font-size:12px">Inventar:</b> <span class="meta">${c.assets.map(a=>esc(a.name)).join(', ')}</span></div>`:''}${c.mats.length?`<div><b style="font-size:12px">Verbrauchsmaterial:</b> <span class="meta">${c.mats.map(m=>`${esc(m.name)} (${m.qty} ${esc(m.unit)})`).join(', ')}</span></div>`:''}${!c.assets.length&&!c.mats.length?'<span class="meta">Noch keine Artikel zugeordnet.</span>':''}</div></div><div class="row wrap"><button class="btn tiny" onclick="showLocationQR('${l.id}')">QR-Code</button>${can('manageInventory')?`<button class="btn tiny" onclick="editLocation('${l.id}')">Bearbeiten</button><button class="btn tiny soft" onclick="editMaterial('', '${l.id}')">+ Material</button>`:''}</div></div>`}).join('')}</div>`}
window.editLocation=id=>{const l=id?state.storageLocations.find(x=>x.id===id):{name:'',owner:'Gemeinde',notes:''};const c=id?locationContents(l):{assets:[],mats:[]};modal(`<h2>${id?'Lagerort bearbeiten':'Lagerort anlegen'}</h2><div class="field"><label>Bezeichnung</label><input id="locName" value="${esc(l.name)}"></div><div class="field" style="margin-top:10px"><label>Zuordnung / Eigentümer</label><input id="locOwner" value="${esc(l.owner||'Gemeinde')}"></div><div class="field" style="margin-top:10px"><label>Beschreibung / sonstiger Inhalt</label><textarea id="locNotes" rows="3" placeholder="z. B. Regale links: Reinigungsmittel; Regal rechts: Ersatzteile">${esc(l.notes||'')}</textarea></div>${id?`<div class="card" style="margin-top:12px"><b>Aktuell zugeordnet</b><div class="meta" style="margin-top:6px">Inventar: ${c.assets.length?c.assets.map(a=>esc(a.name)).join(', '):'–'}</div><div class="meta">Verbrauchsmaterial: ${c.mats.length?c.mats.map(m=>`${esc(m.name)} (${m.qty} ${esc(m.unit)})`).join(', '):'–'}</div></div>`:''}<div class="row wrap" style="margin-top:12px"><button class="btn primary" onclick="saveLocation('${id||''}')">Speichern</button>${id?`<button class="btn soft" onclick="saveLocationAndAddMaterial('${id}')">Speichern & Material hinzufügen</button>`:''}<button class="btn" onclick="closeModal()">Abbrechen</button></div>`)};
window.saveLocation=id=>{const name=$('#locName')?.value.trim()||'Lagerort',owner=$('#locOwner')?.value.trim()||'Gemeinde',notes=$('#locNotes')?.value.trim()||'';state.storageLocations=state.storageLocations||[];let item,old=null;if(id){item=state.storageLocations.find(x=>x.id===id);if(!item){alert('Lagerort wurde nicht gefunden.');return}old={...item};Object.assign(item,{name,owner,notes});state.materials.forEach(m=>{if(!m.locationId&&m.location===old.name)m.location=name})}else{item={id:uid('loc'),name,owner,notes};state.storageLocations.push(item)}try{save()}catch(err){console.error('Lagerort speichern fehlgeschlagen',err);if(id)Object.assign(item,old);else state.storageLocations=state.storageLocations.filter(x=>x.id!==item.id);alert('Lagerort konnte nicht gespeichert werden.');return}closeModal();render()};
window.saveLocationAndAddMaterial=id=>{const name=$('#locName')?.value.trim()||'Lagerort',owner=$('#locOwner')?.value.trim()||'Gemeinde',notes=$('#locNotes')?.value.trim()||'';const item=state.storageLocations.find(x=>x.id===id);if(!item)return;Object.assign(item,{name,owner,notes});try{save()}catch(e){alert('Lagerort konnte nicht gespeichert werden.');return}editMaterial('',id)};

function materialsView(){const low=state.materials.filter(m=>m.qty<m.min),editable=can('manageInventory');return `<div class="section-title"><h2>Verbrauchsmaterial</h2><div class="spacer"></div>${editable?'<button class="btn primary" onclick="editMaterial()">+ Artikel</button>':''}</div>${low.length?`<div class="notice">${low.length} Artikel liegen unter dem Mindestbestand. Sie können direkt auf die Einkaufsliste gesetzt werden.</div>`:''}<div class="card" style="margin-top:12px;overflow:auto"><table class="material-table"><thead><tr><th>Artikel</th><th>Lagerort</th><th>Bestand</th><th>Min.</th><th></th></tr></thead><tbody>${state.materials.map(m=>`<tr><td><b>${esc(m.name)}</b>${m.notes?`<div class="meta">${esc(m.notes)}</div>`:''}</td><td>${esc(materialLocationName(m))}</td><td class="${m.qty<m.min?'low':''}">${m.qty} ${esc(m.unit)}</td><td>${m.min}</td><td><div class="row wrap">${editable?`<button class="btn tiny" onclick="moveQty('${m.id}',-1)">−</button><button class="btn tiny" onclick="moveQty('${m.id}',1)">+</button>${m.qty<m.min?`<button class="btn soft tiny" onclick="toShopping('${m.id}')">Einkauf</button>`:''}<button class="btn tiny" onclick="editMaterial('${m.id}')">Bearbeiten</button>`:''}</div></td></tr>`).join('')}</tbody></table></div><div class="section-title"><h2>Einkaufsliste</h2></div><div class="card">${state.shopping.length?state.shopping.map(x=>`<div class="task">${editable?`<button class="check" onclick="removeShopping('${x.id}')"></button>`:'<div></div>'}<div><div class="task-title">${esc(x.name)}</div><small>${x.amount} ${esc(x.unit)} · Zielbestand ${x.target}</small></div></div>`).join(''):'<div class="empty">Einkaufsliste ist leer.</div>'}</div>`}
window.moveQty=(id,d)=>{const m=state.materials.find(x=>x.id===id);if(!m)return;const old=m.qty;m.qty=Math.max(0,m.qty+d);try{save()}catch(err){m.qty=old;alert('Bestand konnte nicht gespeichert werden. Bitte die Seite neu laden.');return}render()};
window.toShopping=id=>{const m=state.materials.find(x=>x.id===id);if(!state.shopping.find(x=>x.materialId===id))state.shopping.push({id:uid('shop'),materialId:id,name:m.name,amount:Math.max(1,m.target-m.qty),unit:m.unit,target:m.target});save();render()};
window.removeShopping=id=>{state.shopping=state.shopping.filter(x=>x.id!==id);save();render()};
function materialCatalog(){
  const starter=[
    {name:'Mikrofasertücher',unit:'Stk.'},
    {name:'WC-Reiniger',unit:'Fl.'},
    {name:'Flächendesinfektion',unit:'Fl.'},
    {name:'Müllbeutel',unit:'Rolle'},
    {name:'Toilettenpapier',unit:'Rolle'},
    {name:'Papierhandtücher',unit:'Pack'}
  ];
  const map=new Map();
  [...starter,...(state.materials||[]).map(m=>({name:m.name,unit:m.unit||'Stk.'}))].forEach(x=>{
    const name=(x.name||'').trim(); if(!name)return;
    const key=name.toLocaleLowerCase('de'); if(!map.has(key))map.set(key,{name,unit:x.unit||'Stk.'});
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'de'));
}
window.materialArticleChanged=()=>{
  const sel=$('#mArticle'), custom=$('#mName'), unit=$('#mUnit'); if(!sel)return;
  const isNew=sel.value==='__new__';
  if(custom){custom.style.display=isNew?'block':'none'; if(isNew){custom.focus()}else custom.value=''}
  if(!isNew&&unit){const found=materialCatalog().find(x=>x.name===sel.value); if(found)unit.value=found.unit||'Stk.'}
};
window.editMaterial=(id='',preLoc='')=>{
  const m=id?state.materials.find(x=>x.id===id):{name:'',locationId:preLoc,location:'',qty:0,min:1,target:5,unit:'Stk.',notes:''};
  const locId=m?.locationId||preLoc||state.storageLocations.find(l=>l.name===m?.location)?.id||'';
  const catalog=materialCatalog();
  const currentName=(m?.name||'').trim();
  const hasCurrent=currentName&&catalog.some(x=>x.name===currentName);
  const selected=currentName&&hasCurrent?currentName:(id?'__new__':'');
  modal(`<h2>${id?'Verbrauchsmaterial bearbeiten':'Verbrauchsmaterial anlegen'}</h2><div class="formgrid"><div class="field"><label>Artikel</label><select id="mArticle" onchange="materialArticleChanged()"><option value="">Artikel auswählen …</option>${catalog.map(x=>`<option value="${esc(x.name)}" ${selected===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="__new__" ${selected==='__new__'?'selected':''}>＋ Neuen Artikel anlegen …</option></select><input id="mName" style="margin-top:8px;display:${selected==='__new__'?'block':'none'}" placeholder="Bezeichnung des neuen Artikels" value="${selected==='__new__'?esc(currentName):''}"></div><div class="field"><label>Lagerort</label><select id="mLoc"><option value="">ohne Zuordnung</option>${state.storageLocations.map(l=>`<option value="${l.id}" ${locId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>Bestand</label><input id="mQty" type="number" step="0.01" value="${m?.qty??0}"></div><div class="field"><label>Einheit</label><input id="mUnit" value="${esc(m?.unit||'Stk.')}"></div><div class="field"><label>Mindestbestand</label><input id="mMin" type="number" step="0.01" value="${m?.min??1}"></div><div class="field"><label>Sollbestand</label><input id="mTarget" type="number" step="0.01" value="${m?.target??5}"></div><div class="field wide"><label>Notiz / genauer Platz</label><textarea id="mNotes" rows="2" placeholder="z. B. Regal 2, Fach oben">${esc(m?.notes||'')}</textarea></div></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveMaterial('${id}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`);
};
window.saveMaterial=id=>{state.materials=state.materials||[];const locationId=$('#mLoc')?.value||'',loc=state.storageLocations.find(l=>l.id===locationId);const articleSel=$('#mArticle')?.value||'';const articleName=articleSel==='__new__'?($('#mName')?.value.trim()||''):articleSel;if(!articleName){alert('Bitte einen Artikel auswählen oder neu anlegen.');return}const data={name:articleName,locationId,location:loc?.name||'',qty:+($('#mQty')?.value||0),min:+($('#mMin')?.value||0),target:+($('#mTarget')?.value||0),unit:$('#mUnit')?.value.trim()||'Stk.',notes:$('#mNotes')?.value.trim()||''};let item,old=null;if(id){item=state.materials.find(x=>x.id===id);if(!item)return;old={...item};Object.assign(item,data)}else{item={id:uid('mat'),...data};state.materials.push(item)}try{save()}catch(err){console.error('Verbrauchsmaterial speichern fehlgeschlagen',err);if(id)Object.assign(item,old);else state.materials=state.materials.filter(x=>x.id!==item.id);alert('Verbrauchsmaterial konnte nicht gespeichert werden.');return}closeModal();render()};



function availableLoanAssets(){return (state.inventory||[]).filter(a=>a.loanable&&a.loanStatus!=='loaned')}
window.showLoans=()=>{const active=(state.loans||[]).filter(l=>l.status!=='returned'),done=(state.loans||[]).filter(l=>l.status==='returned');modal(`<div class="row"><div><h2>Inventar-Ausleihe</h2><div class="meta">Ausgabe, Kaution und Rückgabe dokumentieren</div></div><div class="spacer"></div><button class="btn primary" onclick="closeModal();newLoan()">+ Ausleihe</button></div><div class="section-title"><h2>Aktiv</h2></div><div class="loan-grid">${active.length?active.map(l=>loanCard(l)).join(''):'<div class="card empty">Keine aktive Ausleihe.</div>'}</div><div class="section-title"><h2>Historie</h2></div><div class="loan-grid">${done.length?done.slice(0,20).map(l=>loanCard(l)).join(''):'<div class="card empty">Noch keine zurückgegebenen Ausleihen.</div>'}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Schließen</button></div>`)};
function loanCard(l){return `<div class="loan-card"><b>${esc(l.borrower)}</b><div class="meta">${new Date(l.loanDate).toLocaleDateString('de-DE')} · ${l.itemIds.length} Gegenstände · Kaution ${Number(l.deposit||0).toLocaleString('de-DE')} €</div><div class="meta">${l.status==='returned'?`zurückgegeben ${l.returnedAt?new Date(l.returnedAt).toLocaleDateString('de-DE'):''}`:`Rückgabe geplant: ${l.dueDate?new Date(l.dueDate).toLocaleDateString('de-DE'):'offen'}`}</div><div class="row wrap" style="margin-top:8px"><button class="btn tiny" onclick="printLoan('${l.id}')">PDF / Drucken</button>${l.status!=='returned'?`<button class="btn tiny primary" onclick="returnLoan('${l.id}')">Rückgabe</button>`:''}</div></div>`}
window.newLoan=()=>{const items=availableLoanAssets();if(!items.length){alert('Es gibt aktuell kein verfügbares, als ausleihbar markiertes Inventar.');return}const deps=state.eventDocumentSettings?.deposits||[150,300,500];modal(`<h2>Neue Ausleihe</h2><div class="formgrid"><div class="field"><label>Ausleiher / Mitglied</label><input id="lnBorrower"></div><div class="field"><label>Telefon / Kontakt</label><input id="lnContact"></div><div class="field"><label>Ausgabedatum</label><input id="lnDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Geplante Rückgabe</label><input id="lnDue" type="date"></div><div class="field"><label>Kaution</label><select id="lnDeposit">${[0,...deps].map(x=>`<option value="${x}">${x} €</option>`).join('')}<option value="other">anderer Betrag</option></select></div><div class="field"><label>Andere Kaution (€)</label><input id="lnDepositOther" type="number" min="0"></div><div class="field wide"><label>Inventar auswählen</label><div class="card" style="box-shadow:none;max-height:280px;overflow:auto">${items.map(a=>`<label class="task"><input class="loanItem" type="checkbox" value="${a.id}"><span><b>${esc(a.name)}</b><small>${esc(a.assetId)} · ${esc(a.category||'')}</small></span></label>`).join('')}</div></div><div class="field wide"><label>Bemerkung</label><textarea id="lnNote" rows="3"></textarea></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveLoan()">Ausleihe anlegen</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)};
window.saveLoan=()=>{const borrower=$('#lnBorrower').value.trim();const itemIds=[...document.querySelectorAll('.loanItem:checked')].map(x=>x.value);if(!borrower||!itemIds.length){alert('Bitte Ausleiher und mindestens einen Gegenstand auswählen.');return}const depSel=$('#lnDeposit').value,deposit=depSel==='other'?+($('#lnDepositOther').value||0):+depSel;const l={id:uid('loan'),borrower,contact:$('#lnContact').value.trim(),loanDate:$('#lnDate').value||new Date().toISOString().slice(0,10),dueDate:$('#lnDue').value,deposit,note:$('#lnNote').value.trim(),itemIds,status:'loaned',createdAt:nowISO(),createdBy:state.currentUserId||''};state.loans.push(l);itemIds.forEach(id=>{const a=state.inventory.find(x=>x.id===id);if(a){a.loanStatus='loaned';a.loanedTo=borrower;a.loanId=l.id}});save();closeModal();render();printLoan(l.id)};
window.returnLoan=id=>{const l=state.loans.find(x=>x.id===id);if(!l)return;if(!confirm(`Ausleihe an ${l.borrower} als vollständig zurückgegeben markieren?`))return;l.status='returned';l.returnedAt=nowISO();l.returnedBy=state.currentUserId||'';l.itemIds.forEach(i=>{const a=state.inventory.find(x=>x.id===i);if(a){a.loanStatus='available';a.loanedTo='';a.loanId=''}});save();closeModal();render();showLoans()};
window.printLoan=id=>{const l=state.loans.find(x=>x.id===id);if(!l)return;const items=l.itemIds.map(i=>state.inventory.find(a=>a.id===i)).filter(Boolean),logo=document.querySelector('.brandmark img')?.src||'';const html=`<!doctype html><html><head><meta charset="utf-8"><title>Ausleihschein</title><style>@page{size:A4;margin:15mm}body{font-family:Arial;color:#222}header{display:flex;align-items:center;border-bottom:2px solid #b00045;padding-bottom:10px}header img{width:65px;margin-right:12px}h1{color:#b00045}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.box{border:1px solid #ccc;padding:10px}.item{padding:8px 0;border-bottom:1px solid #ddd}.sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:50px}.line{border-top:1px solid #333;padding-top:5px}</style></head><body><header>${logo?`<img src="${logo}">`:''}<div><h1>Ausleihschein</h1><div>Evangeliums-Christengemeinde Hussenhofen</div></div></header><div class="meta"><div class="box"><b>Ausleiher</b><br>${esc(l.borrower)}<br>${esc(l.contact||'')}</div><div class="box"><b>Zeitraum</b><br>Ausgabe: ${new Date(l.loanDate).toLocaleDateString('de-DE')}<br>Rückgabe: ${l.dueDate?new Date(l.dueDate).toLocaleDateString('de-DE'):'offen'}</div><div class="box"><b>Kaution</b><br>${Number(l.deposit||0).toLocaleString('de-DE')} €</div><div class="box"><b>Status</b><br>${l.status==='returned'?'zurückgegeben':'ausgeliehen'}</div></div><h2>Ausgeliehene Gegenstände</h2>${items.map(a=>`<div class="item"><b>${esc(a.name)}</b> · ${esc(a.assetId)} · ${esc(a.category||'')}</div>`).join('')}${l.note?`<h2>Bemerkung</h2><p>${esc(l.note)}</p>`:''}<p><b>Kautionshinweis:</b> Die Kaution wird bei ordnungsgemäßer und vollständiger Rückgabe der Gegenstände zurückgegeben. Schäden oder fehlende Teile werden bei der Rückgabe dokumentiert.</p><div class="sig"><div class="line">Datum / Unterschrift Ausleiher</div><div class="line">Datum / Unterschrift ECG</div></div></body></html>`;const w=window.open('','_blank');if(!w){alert('Bitte Pop-ups erlauben.');return}w.document.write(html);w.document.close();setTimeout(()=>w.print(),300)};

window.showEventDocumentSettings=()=>{if(state.currentRole!=='admin')return;const s=state.eventDocumentSettings||{};modal(`<h2>Veranstaltungsvereinbarungen</h2><div class="formgrid"><div class="field wide"><label>Kontaktdaten (eine Zeile je Kontakt)</label><textarea id="edsContacts" rows="4">${esc((s.contactLines||[]).join('\n'))}</textarea></div><div class="field"><label>Kontoinhaber</label><input id="edsHolder" value="${esc(s.accountHolder||'')}"></div><div class="field"><label>Bank</label><input id="edsBank" value="${esc(s.bankName||'')}"></div><div class="field wide"><label>IBAN / Kontoverbindung</label><input id="edsAccount" value="${esc(s.bankAccount||'')}" placeholder="noch nicht hinterlegt"></div><div class="field wide"><label>Kautionsstufen (€; mit Komma trennen)</label><input id="edsDeposits" value="${esc((s.deposits||[]).join(', '))}"></div><div class="field wide"><label>Allgemeine Hinweise</label><textarea id="edsNotes" rows="3">${esc(s.generalNotes||'')}</textarea></div><div class="field wide"><label>Hausordnung / Standardhinweise (eine Regel pro Zeile)</label><textarea id="edsRules" rows="9">${esc((s.houseRules||[]).join('\n'))}</textarea></div></div><div class="notice" style="margin-top:10px">Die vorhandenen Hochzeits-Hausregeln wurden als Ausgangsbasis übernommen. Gebühren und Kontodaten bleiben vollständig bearbeitbar.</div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveEventDocumentSettings()">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)};
window.saveEventDocumentSettings=()=>{const s=state.eventDocumentSettings;Object.assign(s,{contactLines:$('#edsContacts').value.split('\n').map(x=>x.trim()).filter(Boolean),accountHolder:$('#edsHolder').value.trim(),bankName:$('#edsBank').value.trim(),bankAccount:$('#edsAccount').value.trim(),deposits:$('#edsDeposits').value.split(',').map(x=>+x.trim()).filter(x=>Number.isFinite(x)&&x>=0),generalNotes:$('#edsNotes').value.trim(),houseRules:$('#edsRules').value.split('\n').map(x=>x.trim()).filter(Boolean)});save();closeModal();render()};
const legacyShowEventDocumentSettings=window.showEventDocumentSettings;

oll</h1><div>Evangeliums-Christengemeinde Hussenhofen</div></div></header><div class="meta"><div class="box"><b>Veranstaltung</b><br>${esc(ev.title)}</div><div class="box"><b>Datum / Zeit</b><br>${new Date(ev.start).toLocaleString('de-DE')} – ${new Date(ev.end).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div class="box"><b>Veranstalter / Nutzer</b><br>${esc(name)}<br>${esc(contact)}</div><div class="box"><b>Genutzte Bereiche</b><br>${rooms.map(r=>esc(roomLabel(r))).join('<br>')}</div></div>${taskHtml}<h2>Nutzungsgebühr</h2><p><b>${fee.toLocaleString('de-DE',{minimumFractionDigits:2})} €</b>${feeNote?` · ${esc(feeNote)}`:''}</p><p>Die Nutzungsgebühr ist per Überweisung zu bezahlen.<br><b>Kontoverbindung:</b> ${bank}</p><h2>Kautionsvereinbarung</h2><p><b>Kaution: ${deposit.toLocaleString('de-DE',{minimumFractionDigits:2})} €</b> – die Kaution ist in bar zu hinterlegen.</p><p>☐ bar erhalten am __________ &nbsp;&nbsp; ☐ vollständig zurückgezahlt &nbsp;&nbsp; ☐ teilweise / vollständig einbehalten</p><p>Rückzahlungsbetrag: __________ € &nbsp;&nbsp; Begründung bei Einbehalt: ______________________________________</p><h2>Allgemeine Hinweise</h2><p>${esc(s.generalNotes||'')}</p><h2>Hausordnung / Hinweise</h2><ul>${rules}</ul><h2>Schäden / Mängel bei Rückgabe</h2><div style="border:1px solid #ddd;min-height:70px"></div><div class="sig"><div class="line">Datum / Unterschrift Veranstalter</div><div class="line">Datum / Unterschrift ECG / Abnahme</div></div><div class="contacts"><b>Bei Fragen:</b>${contacts}</div></body></html>`;const w=window.open('','_blank');if(!w){alert('Bitte Pop-ups erlauben.');return}w.document.write(html);w.document.close();setTimeout(()=>w.print(),350)};

function eventChecklistFor(eventId){return (state.eventChecklists||[]).find(x=>x.eventId===eventId)||null}
function roomEventTaskTitles(room){
 const allowed=new Set(['daily','weekly','biweekly','asneeded','afteruse','afterevent']);
 return [...new Set((room.tasks||[]).filter(t=>allowed.has(t.interval)).map(t=>t.title).filter(Boolean))];
}
function roomLabel(room){return `${room.floor||'Ohne Geschoss'} – ${room.name}`}
function makeChecklistItem(room,text){return {id:uid('eci'),roomId:room?.id||'',roomLabel:room?roomLabel(room):'Allgemein',text,done:false,note:''}}
function buildEventChecklist(ev,roomIds){
 const rooms=(state.rooms||[]).filter(r=>roomIds.includes(r.id)).sort((a,b)=>floorSortKey(a.floor)-floorSortKey(b.floor)||a.name.localeCompare(b.name,'de'));
 const prep=[],after=[];
 for(const r of rooms){
   prep.push(makeChecklistItem(r,'Raum auf Sauberkeit, Ordnung und Einsatzbereitschaft prüfen'));
   for(const title of roomEventTaskTitles(r)) after.push(makeChecklistItem(r,title));
   after.push(makeChecklistItem(r,'Raum auf Schäden, liegengebliebene Gegenstände und Besonderheiten prüfen'));
 }
 return {id:uid('echeck'),eventId:ev.id,eventTitle:ev.title,eventStart:ev.start,eventEnd:ev.end,eventLocation:ev.location||'',roomIds:rooms.map(r=>r.id),sections:[{key:'prep',title:'Vorbereitung vor der Veranstaltung',items:prep},{key:'after',title:'Kontrolle / Reinigung nach der Veranstaltung',items:after},{key:'accept',title:'Abnahme',items:[makeChecklistItem(null,'Alle genutzten Räume gemeinsam kontrolliert'),makeChecklistItem(null,'Festgestellte Mängel / Schäden dokumentiert'),makeChecklistItem(null,'Schlüssel, Technik und sonstige Übergabepunkte geprüft')]}],responsible:'',organizer:'',generalNotes:'',status:'open',createdAt:nowISO(),updatedAt:nowISO()}
}
window.createEventChecklist=eventId=>{
 const ev=(state.calendarEvents||[]).find(e=>e.id===eventId);if(!ev)return;
 const existing=eventChecklistFor(eventId);if(existing){openEventChecklist(existing.id);return}
 const suggested=eventRoomsFor(eventRuleFor(ev)).map(r=>r.id);
 modal(`<h2>Aufgaben- & Abnahmeliste</h2><div class="notice"><b>${esc(ev.title)}</b><br>${new Date(ev.start).toLocaleString('de-DE')} ${ev.location?`· ${esc(ev.location)}`:''}<br><br>Wähle alle Räume aus, die bei dieser Veranstaltung genutzt werden. Daraus erstellt die App automatisch eine bearbeitbare Aufgaben- und Abnahmeliste.</div><div class="section-title"><h2>Genutzte Räume</h2><div class="spacer"></div><button class="btn tiny" onclick="document.querySelectorAll('.event-room-cb').forEach(x=>x.checked=true)">Alle</button><button class="btn tiny" onclick="document.querySelectorAll('.event-room-cb').forEach(x=>x.checked=false)">Keine</button></div><div class="checklist-room-grid">${(state.rooms||[]).slice().sort((a,b)=>floorSortKey(a.floor)-floorSortKey(b.floor)||a.name.localeCompare(b.name,'de')).map(r=>`<label class="checklist-room"><input class="event-room-cb" type="checkbox" value="${r.id}" ${suggested.includes(r.id)?'checked':''}><span><b>${esc(r.name)}</b><div class="meta">${esc(r.floor||'')} · ${esc(r.type||'Raum')}</div></span></label>`).join('')}</div><div class="row wrap" style="margin-top:14px"><button class="btn primary" onclick="saveNewEventChecklist('${ev.id}')">Liste erstellen</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)
}
window.saveNewEventChecklist=eventId=>{
 const ev=(state.calendarEvents||[]).find(e=>e.id===eventId);if(!ev)return;
 const roomIds=[...document.querySelectorAll('.event-room-cb:checked')].map(x=>x.value);
 if(!roomIds.length){alert('Bitte mindestens einen genutzten Raum auswählen.');return}
 state.eventChecklists=state.eventChecklists||[];
 const c=buildEventChecklist(ev,roomIds);state.eventChecklists.push(c);
 try{save()}catch(e){state.eventChecklists=state.eventChecklists.filter(x=>x.id!==c.id);alert('Die Liste konnte nicht gespeichert werden.');return}
 closeModal();openEventChecklist(c.id);render();
}
function checklistProgress(c){const items=(c.sections||[]).flatMap(s=>s.items||[]);const done=items.filter(i=>i.done).length;return {done,total:items.length}}
window.openEventChecklist=id=>{

 const p=checklistProgress(c);
 modal(`<div class="row"><div><h2>Aufgaben- & Abnahmeliste</h2><div class="meta">${esc(c.eventTitle)}</div></div><div class="spacer"></div><span class="pill ${p.done===p.total&&p.total?'ok':''}">${p.done}/${p.total} erledigt</span></div><div class="checklist-summary"><div class="mini"><b>Datum</b><div>${new Date(c.eventStart).toLocaleDateString('de-DE')}</div></div><div class="mini"><b>Uhrzeit</b><div>${new Date(c.eventStart).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} – ${new Date(c.eventEnd).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="mini"><b>Ort</b><div>${esc(c.eventLocation||'—')}</div></div><div class="mini"><b>Räume</b><div>${(c.roomIds||[]).length}</div></div></div>${(c.sections||[]).map(sec=>`<div class="check-section"><div class="row"><h3>${esc(sec.title)}</h3><div class="spacer"></div><button class="btn tiny" onclick="addChecklistItem('${c.id}','${sec.key}')">+ Punkt</button></div>${(sec.items||[]).map(it=>`<div class="check-item ${it.done?'done':''}"><input type="checkbox" ${it.done?'checked':''} onchange="toggleChecklistItem('${c.id}','${sec.key}','${it.id}',this.checked)"><div><div><b>${esc(it.text)}</b></div><div class="roomtag">${esc(it.roomLabel||'Allgemein')}</div><textarea placeholder="Bemerkung / Mangel (optional)" onchange="updateChecklistNote('${c.id}','${sec.key}','${it.id}',this.value)">${esc(it.note||'')}</textarea><div class="row" style="margin-top:5px"><button class="btn tiny" onclick="editChecklistItem('${c.id}','${sec.key}','${it.id}')">Bearbeiten</button><button class="btn tiny danger" onclick="deleteChecklistItem('${c.id}','${sec.key}','${it.id}')">Entfernen</button></div></div></div>`).join('')}</div>`).join('')}<div class="section-title"><h2>Abnahmeangaben</h2></div><div class="formgrid"><div class="field"><label>Abnahme durchgeführt von</label><input id="ecResponsible" value="${esc(c.responsible||'')}"></div><div class="field"><label>Verantwortliche Person / Veranstalter</label><input id="ecOrganizer" value="${esc(c.organizer||'')}"></div><div class="field wide"><label>Allgemeine Bemerkungen / festgestellte Schäden</label><textarea id="ecGeneralNotes" rows="3">${esc(c.generalNotes||'')}</textarea></div></div><div class="row wrap" style="margin-top:14px"><button class="btn primary" onclick="saveChecklistHeader('${c.id}')">Speichern</button><button class="btn" onclick="saveChecklistHeader('${c.id}',true)">PDF / Drucken</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)
}
window.toggleChecklistItem=(cid,key,iid,val)=>{const c=state.eventChecklists.find(x=>x.id===cid),sec=c?.sections.find(x=>x.key===key),it=sec?.items.find(x=>x.id===iid);if(!it)return;it.done=!!val;c.updatedAt=nowISO();save();openEventChecklist(cid);render()}
window.updateChecklistNote=(cid,key,iid,val)=>{const c=state.eventChecklists.find(x=>x.id===cid),sec=c?.sections.find(x=>x.key===key),it=sec?.items.find(x=>x.id===iid);if(!it)return;it.note=val;c.updatedAt=nowISO();save()}
window.editChecklistItem=(cid,key,iid)=>{const c=state.eventChecklists.find(x=>x.id===cid),sec=c?.sections.find(x=>x.key===key),it=sec?.items.find(x=>x.id===iid);if(!it)return;const text=prompt('Aufgabenpunkt bearbeiten:',it.text);if(text===null)return;it.text=text.trim()||it.text;c.updatedAt=nowISO();save();openEventChecklist(cid)}
window.deleteChecklistItem=(cid,key,iid)=>{const c=state.eventChecklists.find(x=>x.id===cid),sec=c?.sections.find(x=>x.key===key);if(!sec||!confirm('Diesen Aufgabenpunkt entfernen?'))return;sec.items=sec.items.filter(x=>x.id!==iid);c.updatedAt=nowISO();save();openEventChecklist(cid);render()}
window.addChecklistItem=(cid,key)=>{const c=state.eventChecklists.find(x=>x.id===cid),sec=c?.sections.find(x=>x.key===key);if(!sec)return;const text=prompt('Neuer Aufgabenpunkt:');if(!text?.trim())return;sec.items.push(makeChecklistItem(null,text.trim()));c.updatedAt=nowISO();save();openEventChecklist(cid);render()}
window.saveChecklistHeader=(cid,doPrint=false)=>{const c=state.eventChecklists.find(x=>x.id===cid);if(!c)return;c.responsible=$('#ecResponsible')?.value.trim()||'';c.organizer=$('#ecOrganizer')?.value.trim()||'';c.generalNotes=$('#ecGeneralNotes')?.value.trim()||'';c.updatedAt=nowISO();save();render();if(doPrint)printEventChecklist(cid);else openEventChecklist(cid)}
window.printEventChecklist=cid=>{
 const c=state.eventChecklists.find(x=>x.id===cid);if(!c)return;
 const logo=document.querySelector('.brandmark img')?.src||'';

 const html=`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Abnahmeliste – ${esc(c.eventTitle)}</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#222;font-size:11.5pt;margin:0}header{display:flex;align-items:center;border-bottom:2px solid #b00045;padding-bottom:9px;margin-bottom:14px}header img{width:58px;height:auto;margin-right:12px}h1{font-size:20pt;margin:0;color:#b00045}h2{font-size:13pt;margin:15px 0 7px;border-bottom:1px solid #ddd;padding-bottom:4px}.sub{color:#666;margin-top:3px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;border:1px solid #ddd;padding:10px;margin-bottom:12px}.meta b{display:block;font-size:9pt;color:#666}.rooms{margin:8px 0 12px}.item{display:grid;grid-template-columns:24px 1fr;gap:8px;page-break-inside:avoid;border-bottom:1px solid #eee;padding:7px 0}.box{width:18px;height:18px;border:1.5px solid #444;display:inline-flex;align-items:center;justify-content:center;font-weight:bold}.item small{display:block;color:#666;margin-top:2px}.note{font-size:10pt;margin-top:4px}.general{border:1px solid #ddd;min-height:60px;padding:8px;margin-top:6px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:32px}.sig{padding-top:28px;border-top:1px solid #333;font-size:9pt}.printbar{position:fixed;right:12px;top:12px}@media print{.printbar{display:none}}</style></head><body><button class="printbar" onclick="window.print()">Drucken / als PDF sichern</button><header>${logo?`<img src="${logo}">`:''}<div><h1>Aufgaben- & Abnahmeprotokoll</h1><div class="sub">Evangeliums-Christengemeinde Hussenhofen</div></div></header><div class="meta"><div><b>Veranstaltung</b>${esc(c.eventTitle)}</div><div><b>Datum</b>${new Date(c.eventStart).toLocaleDateString('de-DE')}</div><div><b>Uhrzeit</b>${new Date(c.eventStart).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} – ${new Date(c.eventEnd).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div><b>Kalender-Ort</b>${esc(c.eventLocation||'—')}</div><div><b>Abnahme durch</b>${esc(c.responsible||'________________')}</div><div><b>Veranstalter / verantwortlich</b>${esc(c.organizer||'________________')}</div></div><div class="rooms"><b>Genutzte Räume:</b> ${rooms.map(r=>esc(roomLabel(r))).join(' · ')}</div>${sections}<h2>Allgemeine Bemerkungen / Schäden</h2><div class="general">${esc(c.generalNotes||'')}</div><div class="signatures"><div class="sig">Datum / Unterschrift Abnahme</div><div class="sig">Datum / Unterschrift Veranstalter / Verantwortliche Person</div></div></body></html>`;
 const w=window.open('','_blank');if(!w){alert('Bitte Pop-ups für den PDF-/Druckexport erlauben.');return}w.document.open();w.document.write(html);w.document.close();setTimeout(()=>w.focus(),200)
}

function calendarView(){
 const events=(state.calendarEvents||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
 const admin=can('manageCalendar');
 return `<div class="section-title"><h2>Kalender & Veranstaltungen</h2></div>
 <div class="calendar-sync"><b>Google Kalender:</b><span>${esc(ECG_CALENDAR_NAME)}</span><div class="spacer"></div><span class="pill ok">verbunden</span></div>
 <div class="notice" style="margin-top:10px"><b>${esc(CALENDAR_SYNC_NOTE)}</b><br>Die App ist für die automatische Google-Calendar-Synchronisierung vorbereitet. Für die veröffentlichte Web-App muss die Google-Anmeldung einmal serverseitig freigeschaltet werden; bis dahin wird der zuletzt eingelesene Kalenderstand verwendet.</div>

function addMonthsISO(dateStr,months){const d=dateStr?new Date(dateStr+'T12:00:00'):new Date();if(Number.isNaN(d.getTime()))return '';d.setMonth(d.getMonth()+Number(months||0));return d.toISOString().slice(0,10)}
function maintenanceStatus(m){if(!m.nextService)return {key:'open',label:'Termin offen',cls:'status-due'};const days=(new Date(m.nextService+'T23:59:59')-new Date())/86400000;if(days<0)return {key:'overdue',label:'überfällig',cls:'status-overdue'};if(days<=30)return {key:'due',label:'bald fällig',cls:'status-due'};return {key:'ok',label:'aktuell',cls:'status-ok'}}

 return `<div class="row wrap"><div><h2>Wartung & Prüfungen</h2><div class="meta">Technische Anlagen, interne Kontrollen und externe Wartungen</div></div><div class="spacer"></div>${canEdit?'<button class="btn primary" onclick="editMaintenance()">+ Anlage / Gerät</button>':''}</div>

function bindAuthUser(){
 const au=authSession?.user;if(!au)return;
 let u=(state.users||[]).find(x=>(x.email||'').toLowerCase()===(au.email||'').toLowerCase());
 const authRole=Array.isArray(au.role)?au.role[0]:au.role;
 const roleMap={admin:'admin',cleaner:'cleaner',substitute:'backup',backup:'backup',volunteer:'volunteer',technician:'technician',technik:'technician',user:'cleaner',authenticated:'cleaner'};
 if(!u){u={id:au.id,name:au.name||au.email?.split('@')[0]||'Benutzer',email:au.email||'',role:roleMap[authRole]||'cleaner',active:true};state.users=[...(state.users||[]),u]}
 state.currentUserId=u.id;state.currentRole=u.role;
}

}
