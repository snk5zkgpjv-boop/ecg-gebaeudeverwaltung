 if(!can('manageUsers')){alert('Die Benutzerverwaltung ist für dieses Konto nicht freigeschaltet.');return}
 const name=$('#uName').value.trim(),email=$('#uEmail').value.trim().toLowerCase(),role=$('#uRole').value,active=$('#uActive').value==='yes',temporaryPassword=$('#uPassword').value,permissions=Object.fromEntries([...document.querySelectorAll('.user-permission')].map(x=>[x.value,x.checked]));
 if(state.currentRole!=='admin'&&(role==='admin'||permissions.manageUsers===true)){alert('Nur Administratoren dürfen die Adminrolle oder das Recht „Benutzer verwalten“ vergeben.');return}
 if(!name||!email){alert('Bitte Name und E-Mail eintragen.');return}
 if(state.users.some(x=>x.id!==id&&(x.email||'').toLowerCase()===email)){alert('Diese E-Mail ist bereits vergeben.');return}
 if(id){
   const target=state.users.find(x=>x.id===id);
   if(!target)return;
   if(id===state.currentUserId && active===false){alert('Den aktuell angemeldeten Benutzer kannst du nicht deaktivieren.');return}
   const remainingAdmins=state.users.filter(x=>x.id!==id&&x.role==='admin'&&x.active!==false);
   if(target.role==='admin' && (role!=='admin'||active===false) && remainingAdmins.length===0){alert('Mindestens ein aktiver Administrator muss erhalten bleiben.');return}
   Object.assign(target,{name,email,role,active,permissions});
 }else{
   if(temporaryPassword.length<10){alert('Bitte ein vorläufiges Kennwort mit mindestens 10 Zeichen festlegen.');return}
   state.users.push({id:uid('user'),name,email,role,active,permissions,created:nowISO()});
 }
 const cu=currentUser();if(cu)state.currentRole=cu.role;
 localStorage.setItem('cleaningAppState',JSON.stringify(state));
 try{await syncCloud();const target=id?state.users.find(x=>x.id===id):state.users[state.users.length-1];const r=await fetch('/api/auth/admin-user',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({appUserId:target.id,email,name,active,temporaryPassword})});const b=await r.json();if(!r.ok)throw new Error(b.error||'Zugang konnte nicht gespeichert werden.');closeModal();showUserManagement()}catch(e){alert(e.message||'Benutzer konnte nicht gespeichert werden.')}
};
window.deleteUser=id=>{
 if(!can('manageUsers')){alert('Die Benutzerverwaltung ist für dieses Konto nicht freigeschaltet.');return}
 const u=state.users.find(x=>x.id===id);if(!u)return;
 if(state.currentRole!=='admin'&&(u.role==='admin'||id===state.currentUserId)){alert('Administratorkonten und das eigene Benutzerkonto können nur von einem Administrator gelöscht werden.');return}
 if(id===state.currentUserId){alert('Der aktuell angemeldete Benutzer kann nicht gelöscht werden.');return}
 if(u.role==='admin'&&state.users.filter(x=>x.id!==id&&x.role==='admin'&&x.active!==false).length===0){alert('Mindestens ein aktiver Administrator muss erhalten bleiben.');return}
 const hasHistory=(state.timeEntries||[]).some(e=>e.userId===id);
 if(hasHistory&&!confirm(`${u.name} hat bereits Zeiterfassungen. Wirklich löschen? Deaktivieren wäre sicherer.`))return;
 if(!hasHistory&&!confirm(`${u.name} wirklich löschen?`))return;
 state.users=state.users.filter(x=>x.id!==id);save();closeModal();showUserManagement()
};
window.showTimeReport=()=>modal(`<h2>Zeiterfassungsübersicht</h2><div class="card" style="box-shadow:none">${(state.timeEntries||[]).length?state.timeEntries.map(e=>{const u=state.users.find(x=>x.id===e.userId);return `<div class="task"><div></div><div><div class="task-title">${esc(timeEntryLabel(e))}</div><small>${esc(u?.name||'Benutzer')}${u?.email?` · ${esc(u.email)}`:''} · ${new Date(e.start).toLocaleString('de-DE')} – ${new Date(e.end).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} · ${fmtDuration(new Date(e.end)-new Date(e.start))}${e.note?` · ${esc(e.note)}`:''}${e.volunteer?' · freiwilliger Dienst':''}</small><div class="row" style="margin-top:7px"><button class="btn tiny" onclick="editTimeEntry('${e.id}')">Bearbeiten</button><button class="btn tiny danger" onclick="deleteTimeEntry('${e.id}')">Löschen</button></div></div></div>`}).join(''):'<div class="empty">Noch keine Arbeitszeiten erfasst.</div>'}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">Schließen</button></div>`);
window.editTimeEntry=id=>{const e=(state.timeEntries||[]).find(x=>x.id===id);if(!e)return;const local=v=>{const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};modal(`<h2>Arbeitszeit bearbeiten</h2><div class="formgrid"><div class="field"><label>Beginn</label><input id="teStart" type="datetime-local" value="${local(e.start)}"></div><div class="field"><label>Ende</label><input id="teEnd" type="datetime-local" value="${local(e.end)}"></div><div class="field wide"><label>Tätigkeit / Bemerkung</label><input id="teNote" value="${esc(e.note||'')}"></div><label class="field wide"><span><input id="teVolunteer" type="checkbox" ${e.volunteer?'checked':''}> Als freiwilligen Dienst ausweisen</span></label></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveTimeEntry('${id}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)};
window.saveTimeEntry=id=>{const e=(state.timeEntries||[]).find(x=>x.id===id);if(!e)return;const start=$('#teStart').value,end=$('#teEnd').value;if(!start||!end||new Date(end)<=new Date(start)){alert('Bitte einen gültigen Zeitraum eintragen.');return}e.start=new Date(start).toISOString();e.end=new Date(end).toISOString();e.note=$('#teNote').value.trim();e.volunteer=$('#teVolunteer').checked;save();closeModal();closeModal();showTimeReport()};
window.deleteTimeEntry=id=>{const e=(state.timeEntries||[]).find(x=>x.id===id);if(!e||!confirm('Diesen Zeiteintrag wirklich löschen?'))return;state.timeEntries=state.timeEntries.filter(x=>x.id!==id);save();closeModal();showTimeReport()};

window.toggleCloud=async v=>{state.settings.cloudSync=v;save();if(v)await pullCloud();render()}; window.toggleTime=v=>{state.settings.personalTimeTracking=v;save();render()};
window.exportData=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`reinigung-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
window.importData=()=>{$('#fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.version)throw 0;state=x;save();render();alert('Backup importiert.')}catch{alert('Ungültige Backup-Datei.')}};r.readAsText(f)};$('#fileImport').click()};
window.resetDemo=()=>{if(confirm('Alle lokalen Änderungen zurücksetzen?')){state=structuredClone(initialState);save();render()}};

window.pickRoomPhoto=id=>{$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{state.rooms.find(r=>r.id===id).photo=rd.result;save();openRoom(id)};rd.readAsDataURL(f)};$('#photoInput').click()};
function modal(html){$('#modalRoot').insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modalBack"><div class="modal"><button type="button" class="modal-close no-print" onclick="closeModal()" aria-label="Fenster schließen" title="Schließen">×</button>${html}</div></div>`)}
window.closeModal=()=>$('#modalBack')?.remove();
window.modal=modal;

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

showLoginGate=function(message=''){
 document.getElementById('authGate')?.remove();
 document.body.insertAdjacentHTML('beforeend',`<div class="auth-gate" id="authGate"><div class="auth-card"><div style="text-align:center"><div style="font-size:48px;color:#b00045">✝</div><h2>ECG Gebäudeverwaltung</h2><p>E-Mail-Adresse und Kennwort</p></div><div class="field"><label>E-Mail-Adresse</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field" style="margin-top:10px"><label>Kennwort</label><input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')loginWithPassword()"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="loginWithPassword()">Anmelden</button><button class="btn" style="width:100%;margin-top:8px" onclick="forgotPassword()">Kennwort vergessen</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="startLegacyMigration()">Bisherigen PIN-Zugang einmalig umstellen</button><div class="auth-status" id="authStatus">${esc(message)}</div></div></div>`)
};
window.loginWithPassword=async()=>{const st=$('#authStatus');st.textContent='Anmeldung wird geprüft …';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#loginEmail').value,password:$('#loginPassword').value})}),b=await r.json();if(!r.ok)throw new Error(b.error);authSession={user:b.user};bindAuthUser();state.settings.cloudSync=true;$('#authGate')?.remove();await pullCloud();render();openFromQuery();if(b.user.mustChangePassword)setTimeout(()=>changePasswordDialog(true),100)}catch(e){st.textContent=e.message||'Anmeldung fehlgeschlagen.'}};
window.forgotPassword=async()=>{const email=($('#loginEmail')?.value||prompt('E-Mail-Adresse:')||'').trim();if(!email)return;const st=$('#authStatus');st.textContent='Anfrage wird gesendet …';const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})}),b=await r.json();st.textContent=r.ok?b.message:(b.error||'E-Mail konnte nicht versendet werden.')};
window.startLegacyMigration=()=>{const g=$('#authGate .auth-card');g.innerHTML=`<h2>PIN-Zugang umstellen</h2><p>Einmalig den bisherigen E-Mail-Code anfordern und danach ein eigenes Kennwort festlegen.</p><div class="field"><label>E-Mail</label><input id="legacyEmail" type="email"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="sendLegacyCode()">PIN/Code senden</button><button class="btn" style="width:100%;margin-top:8px" onclick="showLoginGate()">Zurück</button><div class="auth-status" id="authStatus"></div>`};
window.sendLegacyCode=async()=>{const email=$('#legacyEmail').value.trim().toLowerCase(),st=$('#authStatus');st.textContent='Code wird gesendet …';try{const r=await window.ecgAuth.emailOtp.sendVerificationOtp({email,type:'sign-in'});if(r.error)throw r.error;$('#authGate .auth-card').innerHTML=`<h2>Neues Kennwort festlegen</h2><input id="legacyEmail" type="hidden" value="${esc(email)}"><div class="field"><label>E-Mail-Code</label><input id="legacyOtp" inputmode="numeric"></div><div class="field" style="margin-top:10px"><label>Neues Kennwort</label><input id="legacyPassword" type="password" minlength="10"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="finishLegacyMigration()">Zugang umstellen</button><div class="auth-status" id="authStatus">Mindestens 10 Zeichen.</div>`}catch(e){st.textContent=e.message||'Code konnte nicht gesendet werden.'}};
window.finishLegacyMigration=async()=>{const st=$('#authStatus');try{const email=$('#legacyEmail').value,otp=$('#legacyOtp').value,password=$('#legacyPassword').value,r=await window.ecgAuth.signIn.emailOtp({email,otp});if(r.error)throw r.error;const t=await window.ecgAuth.token();if(t.error||!t.data?.token)throw new Error('PIN-Anmeldung fehlgeschlagen.');const mr=await fetch('/api/auth/migrate',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${t.data.token}`},body:JSON.stringify({password})}),b=await mr.json();if(!mr.ok)throw new Error(b.error);await bootAuth()}catch(e){st.textContent=e.message||'Umstellung fehlgeschlagen.'}};
window.changePasswordDialog=forced=>modal(`<h2>${forced?'Vorläufiges Kennwort ändern':'Kennwort ändern'}</h2><p class="meta">Das neue Kennwort muss mindestens 10 Zeichen haben.</p><div class="field"><label>Bisheriges Kennwort</label><input id="oldPw" type="password"></div><div class="field" style="margin-top:10px"><label>Neues Kennwort</label><input id="newPw" type="password"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="submitPasswordChange()">Ändern</button>${forced?'':'<button class="btn" onclick="closeModal()">Abbrechen</button>'}</div>`);
window.submitPasswordChange=async()=>{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({currentPassword:$('#oldPw').value,newPassword:$('#newPw').value})}),b=await r.json();if(!r.ok)return alert(b.error);alert(b.message);await signOutApp()};
window.accountDialog=()=>{const u=currentUser();modal(`<h2>Mein Konto</h2><div class="card" style="box-shadow:none">${userSummaryCard(u)}</div><div class="row wrap" style="margin-top:12px">${can('manageUsers')?'<button class="btn" onclick="closeModal();showUserManagement()">Benutzerverwaltung</button>':''}<button class="btn" onclick="closeModal();changePasswordDialog(false)">Kennwort ändern</button><button class="btn danger" onclick="signOutApp()">Abmelden</button><button class="btn" onclick="closeModal()">Schließen</button></div>`)};
window.signOutApp=async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}catch{}authSession=null;closeModal();showLoginGate('Du wurdest abgemeldet.')};
window.submitResetPassword=async()=>{const token=new URLSearchParams(location.search).get('reset'),r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,newPassword:$('#resetPw').value})}),b=await r.json();if(!r.ok)return $('#resetStatus').textContent=b.error;history.replaceState({},'',location.pathname);showLoginGate('Kennwort geändert. Du kannst dich jetzt anmelden.')};
function showResetGate(){document.body.insertAdjacentHTML('beforeend',`<div class="auth-gate" id="authGate"><div class="auth-card"><h2>Neues Kennwort</h2><div class="field"><label>Neues Kennwort (mindestens 10 Zeichen)</label><input id="resetPw" type="password"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="submitResetPassword()">Kennwort speichern</button><div id="resetStatus" class="auth-status"></div></div></div>`)}
async function bootAuth(){render();if(new URLSearchParams(location.search).get('reset'))return showResetGate();try{const r=await fetch('/api/auth/session'),b=await r.json();if(!r.ok)return showLoginGate();authSession={user:b.user};bindAuthUser();state.settings.cloudSync=true;await pullCloud();render();openFromQuery();if(state.timeRunning)startTimerTick();if(b.user.mustChangePassword)setTimeout(()=>changePasswordDialog(true),100)}catch{showLoginGate('Anmeldung konnte nicht geprüft werden.')}}
bootAuth();
</script>
</body>
</html>
